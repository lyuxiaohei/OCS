<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>回复用户留言 · 抽屉</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { background: #fff; margin: 0; }
    .dw-body { display: flex; flex-direction: column; min-height: 100vh; }
    .drawer-head { padding: 16px 24px; border-bottom: 1px solid var(--cs-border-light); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .drawer-head .title { font-size: 16px; font-weight: 600; }
    .drawer-head .close { font-size: 20px; color: var(--cs-text-tertiary); cursor: pointer; line-height: 1; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 20px 24px; }
    .drawer-foot { padding: 12px 24px; border-top: 1px solid var(--cs-border-light); display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0; }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 13px; color: var(--cs-text-secondary); margin-bottom: 6px; }
    .form-select, .form-textarea {
      width: 100%; border: 1px solid var(--cs-border); border-radius: 6px;
      padding: 8px 12px; font-size: 13px; font-family: inherit; background: #fff;
      outline: none; transition: border-color 0.15s;
    }
    .form-select { height: 36px; cursor: pointer; }
    .form-select:focus, .form-textarea:focus { border-color: var(--cs-primary); box-shadow: 0 0 0 2px rgba(22,119,255,0.1); }
    .form-textarea { resize: vertical; min-height: 96px; line-height: 1.6; }
    .msg-detail-box { background: #f6f8fa; border: 1px solid var(--cs-border-light); border-radius: 6px; padding: 12px 14px; margin-bottom: 18px; }
    .msg-detail-box .detail-row { display: flex; font-size: 13px; padding: 4px 0; }
    .msg-detail-box .detail-label { color: var(--cs-text-tertiary); width: 70px; flex-shrink: 0; }
    .msg-detail-box .detail-content { color: var(--cs-text); }
    .msg-detail-box .detail-msg { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e8e8e8; font-size: 13px; color: var(--cs-text-secondary); line-height: 1.6; }
    .tag-urgent { display: inline-block; padding: 2px 8px; background: var(--cs-danger-bg); color: var(--cs-danger); border: 1px solid #ffccc7; border-radius: 4px; font-size: 12px; }
    .notify-row { display: flex; gap: 16px; font-size: 13px; }
    .notify-row label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="dw-body">
    <div class="drawer-head">
      <div class="title">回复用户留言</div>
      <div class="close" onclick="window.csModalBridge.close()">×</div>
    </div>
    <div class="drawer-body">
      <div class="msg-detail-box">
        <div class="detail-row"><span class="detail-label">留言人</span><span class="detail-content">李婷婷 · 138****6621</span></div>
        <div class="detail-row"><span class="detail-label">分类</span><span class="detail-content"><span class="tag-urgent">退款/退货</span></span></div>
        <div class="detail-row"><span class="detail-label">订单号</span><span class="detail-content">#20260611039</span></div>
        <div class="detail-msg">订单 #20260611039 申请退款两天了还没到账，麻烦尽快处理，谢谢！</div>
      </div>

      <div class="form-group">
        <label class="form-label">快捷回复模板</label>
        <select class="form-select" id="tpl" onchange="document.getElementById('replyText').value=this.value">
          <option value="">— 选择模板 —</option>
          <option value="您好，您的退款已加急处理，预计 1-2 个工作日内到账，请留意银行卡到账短信，感谢您的耐心等待！">退款到账-加急</option>
          <option value="您好，已为您核实订单信息，稍后会有专员与您电话联系，请保持手机畅通，谢谢！">核实中-待联系</option>
          <option value="您好，问题已受理，我们会在 24 小时内处理完毕并通过短信通知您，请放心。">受理-24小时</option>
        </select>
        <textarea class="form-textarea" id="replyText" style="margin-top:8px;" placeholder="选择模板或手动输入回复内容..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">通知方式</label>
        <div class="notify-row">
          <label><input type="checkbox" checked /> 站内消息</label>
          <label><input type="checkbox" checked /> 短信</label>
          <label><input type="checkbox" /> 微信模板消息</label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">处理结果标记</label>
        <select class="form-select" id="result">
          <option value="solved">已解决</option>
          <option value="followup">待跟进</option>
          <option value="transfer">需转人工客服</option>
        </select>
      </div>
    </div>
    <div class="drawer-foot">
      <button class="btn-default" onclick="window.csModalBridge.close()">取消</button>
      <button class="btn-primary" id="confirmBtn">发送回复</button>
    </div>
  </div>

  <script src="../js/cs-modal.js"></script>
  <script>
    document.getElementById('confirmBtn').addEventListener('click', function () {
      var text = document.getElementById('replyText').value.trim();
      if (!text) {
        var el = document.getElementById('replyText');
        el.style.borderColor = 'var(--cs-danger)'; el.focus();
        setTimeout(function () { el.style.borderColor = ''; }, 1500);
        return;
      }
      window.csModalBridge.confirm({
        content: text,
        result: document.getElementById('result').value
      });
    });
  </script>
</body>
</html>

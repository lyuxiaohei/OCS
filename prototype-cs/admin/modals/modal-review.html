<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>审核文章 · 弹窗</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { background: transparent; margin: 0; }
    .csm-body { width: 620px; max-width: 94vw; }
    .rv-body { padding: 18px 20px; }
    .rv-preview {
      background: var(--cs-bg-header); border-radius: var(--cs-radius-sm);
      padding: 16px; margin-bottom: 16px;
    }
    .rv-preview .rv-plabel { font-size: 12px; color: var(--cs-text-tertiary); margin-bottom: 4px; }
    .rv-preview .rv-ptitle { font-size: 15px; font-weight: 600; color: var(--cs-text); }
    .rv-preview .rv-pdesc { font-size: 12px; color: var(--cs-text-secondary); margin-top: 8px; line-height: 1.6; }
    .form-group { margin-bottom: 14px; }
    .form-group > label { display: block; font-size: 13px; color: var(--cs-text); margin-bottom: 6px; font-weight: 500; }
    .form-ipt {
      width: 100%; border: 1px solid #d9d9d9; border-radius: 6px;
      padding: 7px 11px; font-size: 13px; font-family: inherit; background: #fff;
      outline: none; transition: border-color 0.15s;
    }
    .form-ipt:focus { border-color: var(--cs-primary); box-shadow: 0 0 0 2px rgba(22,119,255,0.1); }
    select.form-ipt { height: 34px; cursor: pointer; }
    textarea.form-ipt { min-height: 80px; resize: vertical; }
    .decision-row { display: flex; gap: 16px; margin-top: 4px; }
    .decision-row label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 500; }
    .decision-row .approve { color: var(--cs-success); }
    .decision-row .reject { color: var(--cs-danger); }
  </style>
</head>
<body>
  <div class="csm-body">
    <div class="csm-head">
      <span>审核文章</span>
      <span class="csm-close" onclick="window.csModalBridge.close()">×</span>
    </div>
    <div class="rv-body">
      <div class="rv-preview">
        <div class="rv-plabel">文章标题</div>
        <div class="rv-ptitle" id="articleTitle">退款到账时效说明</div>
        <div class="rv-pdesc" id="articlePreview">文章内容预览区域，供审核人查看文章核心内容后再做审核决定。</div>
      </div>

      <div class="form-group">
        <label>审核人</label>
        <select class="form-ipt" id="reviewer">
          <option value="">指定审核人</option>
          <option value="王主管">王主管</option>
          <option value="李主管">李主管</option>
          <option value="张经理">张经理</option>
        </select>
      </div>

      <div class="form-group">
        <label>审核决定</label>
        <div class="decision-row">
          <label class="approve"><input type="radio" name="decision" value="approve"> 通过</label>
          <label class="reject"><input type="radio" name="decision" value="reject"> 驳回</label>
        </div>
      </div>

      <div class="form-group" id="rejectGroup" style="display:none;">
        <label>驳回原因 <span style="color:var(--cs-danger);">*</span></label>
        <textarea class="form-ipt" id="rejectReason" placeholder="请输入驳回原因，帮助作者改进..."></textarea>
      </div>
    </div>
    <div class="csm-foot">
      <button class="btn-default" onclick="window.csModalBridge.close()">取消</button>
      <button class="btn-primary" id="submitBtn">提交审核结果</button>
    </div>
  </div>

  <script src="../js/cs-modal.js"></script>
  <script>
    (function () {
      // 通过 URL 参数接收文章信息
      var p = new URLSearchParams(location.search);
      var t = p.get('title'), pv = p.get('preview');
      if (t) document.getElementById('articleTitle').textContent = decodeURIComponent(t);
      if (pv) document.getElementById('articlePreview').textContent = decodeURIComponent(pv);

      var rejectGroup = document.getElementById('rejectGroup');
      document.querySelectorAll('input[name="decision"]').forEach(function (r) {
        r.addEventListener('change', function () {
          rejectGroup.style.display = this.value === 'reject' ? '' : 'none';
        });
      });

      document.getElementById('submitBtn').addEventListener('click', function () {
        var chosen = document.querySelector('input[name="decision"]:checked');
        if (!chosen) { alert('请选择审核决定'); return; }
        if (chosen.value === 'reject') {
          var reason = document.getElementById('rejectReason').value.trim();
          if (!reason) {
            var el = document.getElementById('rejectReason');
            el.style.borderColor = 'var(--cs-danger)'; el.focus();
            setTimeout(function () { el.style.borderColor = ''; }, 1500);
            return;
          }
          window.csModalBridge.confirm({ decision: 'reject', reviewer: document.getElementById('reviewer').value, reason: reason });
        } else {
          window.csModalBridge.confirm({ decision: 'approve', reviewer: document.getElementById('reviewer').value });
        }
      });
    })();
  </script>
</body>
</html>

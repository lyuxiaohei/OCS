<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>新建工单</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { background:#fff; margin:0; font-family: inherit; }
    .mk-body { padding:20px 24px 8px; }
    .mk-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .mk-head .title { font-size:var(--cs-font-size-lg); font-weight:var(--cs-font-weight-semibold); color:var(--cs-text); }
    .mk-head .close { font-size:22px; color:var(--cs-text-tertiary); cursor:pointer; line-height:1; }
    .mk-head .close:hover { color:var(--cs-text); }
    .ctx-box { background:var(--cs-primary-bg); border:1px solid #91caff; border-radius:var(--cs-radius-sm); padding:10px 12px; margin-bottom:18px; font-size:var(--cs-font-size-xs); color:var(--cs-text-secondary); }
    .ctx-box .ctx-title { color:var(--cs-primary); font-weight:var(--cs-font-weight-semibold); margin-bottom:6px; display:flex; align-items:center; gap:6px; }
    .ctx-box .ctx-row { padding:2px 0; }
    .ctx-box .ctx-row b { color:var(--cs-text); font-weight:var(--cs-font-weight-medium); }
    .mk-field { margin-bottom:14px; }
    .mk-label { display:block; font-size:var(--cs-font-size-sm); color:var(--cs-text-secondary); margin-bottom:6px; }
    .mk-label .req { color:var(--cs-danger); margin-left:2px; }
    .mk-label .opt { color:var(--cs-text-tertiary); font-weight:normal; margin-left:4px; }
    .mk-input, .mk-select, .mk-textarea { width:100%; border:1px solid var(--cs-border); border-radius:var(--cs-radius-sm); padding:7px 10px; font-size:var(--cs-font-size-sm); font-family:inherit; background:#fff; outline:none; transition:border-color .2s; }
    .mk-input:focus, .mk-select:focus, .mk-textarea:focus { border-color:var(--cs-primary); box-shadow:0 0 0 2px rgba(22,119,255,0.1); }
    .mk-textarea { resize:vertical; min-height:72px; line-height:1.6; }
    .mk-select { appearance:auto; }
    .readonly-field { background:var(--cs-bg-header); color:var(--cs-text-secondary); }

    /* 内联选择(搜索框 + 结果列表,不开嵌套 picker) */
    .inline-pick { position:relative; }
    .inline-pick .ip-input { width:100%; border:1px solid var(--cs-border); border-radius:var(--cs-radius-sm); padding:7px 10px; font-size:var(--cs-font-size-sm); outline:none; background:#fff; }
    .inline-pick .ip-input.filled { background:var(--cs-primary-bg); color:var(--cs-text); font-weight:var(--cs-font-weight-medium); }
    .inline-pick .ip-input:focus { border-color:var(--cs-primary); }
    .inline-list { margin-top:6px; max-height:200px; overflow-y:auto; border:1px solid var(--cs-border-light); border-radius:var(--cs-radius-sm); }
    .inline-item { padding:8px 10px; cursor:pointer; border-bottom:1px solid var(--cs-border-lighter); font-size:var(--cs-font-size-sm); }
    .inline-item:last-child { border-bottom:none; }
    .inline-item:hover { background:var(--cs-primary-bg); }
    .inline-item.selected { background:var(--cs-primary-bg); }
    .inline-item .ii-main { color:var(--cs-text); }
    .inline-item .ii-sub { color:var(--cs-text-tertiary); font-size:var(--cs-font-size-xs); margin-top:2px; }
    .inline-empty { padding:12px; text-align:center; font-size:var(--cs-font-size-xs); color:var(--cs-text-tertiary); }
    .ip-hint { margin-top:4px; font-size:var(--cs-font-size-xs); color:var(--cs-text-tertiary); }
    .ip-clear { margin-left:6px; color:var(--cs-text-tertiary); cursor:pointer; font-size:var(--cs-font-size-xs); }
    .ip-clear:hover { color:var(--cs-danger); }

    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .mk-foot { display:flex; justify-content:flex-end; gap:8px; padding:14px 24px; border-top:1px solid var(--cs-border-light); margin:8px -24px 0; }
  </style>
</head>
<body>
<div class="mk-body">
  <div class="mk-head">
    <div class="title">新建工单</div>
    <div class="close" onclick="window.csModalBridge.close()">×</div>
  </div>

  <!-- 转工单上下文(仅转工单模式) -->
  <div class="ctx-box" id="ctxBox">
    <div class="ctx-title">已从会话自动带入</div>
    <div class="ctx-row">来源会话:<b>#CS20260716088</b> · 客户:<b>陈芳(138****2891)</b></div>
    <div class="ctx-row">关联订单:<b>#DD20260710003</b> · 会话摘要:退款未到账,客户催促</div>
  </div>

  <div class="mk-field">
    <label class="mk-label">标题<span class="req">*</span></label>
    <input class="mk-input" id="fTitle" placeholder="简述问题" />
  </div>

  <div class="two-col">
    <div class="mk-field">
      <label class="mk-label">工单类型<span class="req">*</span></label>
      <select class="mk-select" id="fType">
        <option>退款</option><option>退货退款</option><option>换货</option>
        <option>投诉</option><option>补发</option><option>价格干预</option>
      </select>
    </div>
    <div class="mk-field">
      <label class="mk-label">优先级</label>
      <select class="mk-select" id="fPriority">
        <option value="">请选择</option>
        <option value="紧急">紧急</option><option value="高">高</option>
        <option value="中">中</option><option value="低">低</option>
      </select>
    </div>
  </div>

  <!-- 客户:转工单只读 / 手动选内联搜索 -->
  <div class="mk-field">
    <label class="mk-label">客户<span class="req">*</span></label>
    <input class="mk-input readonly-field" id="fCustomerRO" style="display:none;" readonly />
    <div class="inline-pick" id="fCustomerPick" style="display:none;">
      <input class="ip-input" id="custSearch" placeholder="搜索 手机号 / 昵称 / 用户ID" autocomplete="off" />
      <div class="ip-hint" id="custHint">输入关键词搜索客户</div>
      <div class="inline-list" id="custList" style="display:none;"></div>
    </div>
  </div>

  <!-- 订单:转工单只读 / 手动选(选客户后内联) -->
  <div class="mk-field">
    <label class="mk-label">关联订单<span class="opt">(可选)</span></label>
    <input class="mk-input readonly-field" id="fOrderRO" style="display:none;" readonly />
    <div class="inline-pick" id="fOrderPick" style="display:none;">
      <div class="ip-input" id="orderBox" style="cursor:default;color:var(--cs-text-placeholder);">请先选择客户</div>
      <div class="inline-list" id="orderList" style="display:none;"></div>
    </div>
  </div>

  <div class="mk-field">
    <label class="mk-label">工单描述</label>
    <textarea class="mk-textarea" id="fDesc" placeholder="详细描述问题"></textarea>
  </div>

  <div class="mk-foot">
    <button class="btn-default" onclick="window.csModalBridge.close()">取消</button>
    <button class="btn-primary" onclick="submit()">创建工单</button>
  </div>
</div>

<script src="../js/cs-modal.js"></script>
<script>
  function toast(t) { try { window.parent.csModal.toast(t); } catch (e) {} }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  /* 内容高度变化时上报,父窗动态调整弹窗 iframe 高度(避免展开订单后被截) */
  function syncHeight(){ try { if (window.csModalBridge && csModalBridge.reportHeight) csModalBridge.reportHeight(document.body.scrollHeight); } catch (e) {} }
  function syncHeightLater(){ setTimeout(syncHeight, 30); }

  /* mock 数据(1 期;正式:客户搜索 customer/search + 按客户查订单 customer/orders) */
  var CUSTOMERS = [
    { user_id:'U20260710001', name:'陈芳',   phone:'138****2891', level:'黄金会员', tags:['高价值'] },
    { user_id:'U20260710002', name:'刘洋',   phone:'139****5678', level:'普通会员', tags:[] },
    { user_id:'U20260710003', name:'周婷婷', phone:'137****1024', level:'白银会员', tags:['退货多'] },
    { user_id:'U20260710004', name:'赵磊',   phone:'135****8821', level:'黄金会员', tags:[] },
    { user_id:'U20260710005', name:'王志强', phone:'159****6601', level:'普通会员', tags:[] },
    { user_id:'U20260710006', name:'陈思雨', phone:'186****0452', level:'VIP', tags:['VIP'] },
    { user_id:'U20260710007', name:'孙莉',   phone:'136****4477', level:'白银会员', tags:[] },
    { user_id:'U20260710008', name:'吴强',   phone:'133****6290', level:'普通会员', tags:[] }
  ];
  var ORDERS = [
    { user_id:'U20260710001', order_id:'#DD20260710003', goods:'无线蓝牙耳机(黑色)', amount:'¥299', time:'2026-07-10', state:'已签收' },
    { user_id:'U20260710001', order_id:'#DD20260708001', goods:'不锈钢保温杯 500ml', amount:'¥89', time:'2026-07-08', state:'已完成' },
    { user_id:'U20260710002', order_id:'#DD20260712001', goods:'男士跑步鞋 42码', amount:'¥459', time:'2026-07-12', state:'待发货' },
    { user_id:'U20260710003', order_id:'#DD20260709001', goods:'玻璃水杯(破损补发)', amount:'¥39', time:'2026-07-09', state:'运输中' },
    { user_id:'U20260710004', order_id:'#DD20260711001', goods:'羽绒被 1.8m', amount:'¥699', time:'2026-07-11', state:'已签收' },
    { user_id:'U20260710006', order_id:'#DD20260713001', goods:'护肤套装(deluxe)', amount:'¥1280', time:'2026-07-13', state:'已完成' }
  ];

  var state = { user_id:'', user_name:'', order_id:'', session_id:'' };
  var mode = new URLSearchParams(location.search).get('mode') || '';
  var standalone = mode === 'standalone';
  var orderMode = mode === 'order';

  if (standalone) {
    document.getElementById('ctxBox').style.display = 'none';
    document.getElementById('fCustomerPick').style.display = '';
    document.getElementById('fOrderPick').style.display = '';
  } else if (orderMode) {
    /* 纪要③ 订单受理带入:订单管理页「受理」→带订单/客户建单(OMS 收货/项目名字段待梳理后补) */
    var p = new URLSearchParams(location.search);
    var oid = p.get('oid') || '', goods = p.get('goods') || '', phone = p.get('phone') || '', amount = p.get('amount') || '', ostate = p.get('state') || '';
    var ctxBox = document.getElementById('ctxBox');
    ctxBox.style.display = '';
    ctxBox.innerHTML = '<div class="ctx-title">已从订单受理带入</div>'
      + '<div class="ctx-row">关联订单:<b>' + esc(oid) + '</b> · 商品:<b>' + esc(goods) + '</b> · ' + esc(amount) + '</div>'
      + '<div class="ctx-row">客户:<b>' + esc(phone) + '</b> · 订单状态:' + esc(ostate) + '</div>';
    document.getElementById('fCustomerRO').style.display = '';
    document.getElementById('fOrderRO').style.display = '';
    document.getElementById('fCustomerRO').value = phone || '(订单未关联客户)';
    document.getElementById('fOrderRO').value = oid + (goods ? ' · ' + goods : '') + (amount ? ' (' + amount + ')' : '');
    document.getElementById('fTitle').value = goods ? ('订单售后受理 - ' + goods) : '';
    state.user_name = phone || '(订单未关联客户)';
    state.order_id = oid;
  } else {
    document.getElementById('fCustomerRO').style.display = '';
    document.getElementById('fOrderRO').style.display = '';
    document.getElementById('fCustomerRO').value = '陈芳(138****2891)';
    document.getElementById('fOrderRO').value = '#DD20260710003';
    document.getElementById('fTitle').value = '订单退款两天未到账';
    document.getElementById('fDesc').value = '客户反馈订单 #DD20260710003 的退款申请于 7/14 提交,两天未到账,情绪激动。';
    state.user_id = 'U20260710001'; state.user_name = '陈芳(138****2891)';
    state.order_id = '#DD20260710003'; state.session_id = '#CS20260716088';
  }

  /* —— 客户内联搜索 —— */
  var custSearch = document.getElementById('custSearch');
  var custList = document.getElementById('custList');
  var custHint = document.getElementById('custHint');

  function renderCust(kw) {
    kw = (kw || '').trim().toLowerCase();
    var filtered = CUSTOMERS.filter(function (c) {
      if (!kw) return false; /* 空关键词不展示(避免一长串) */
      return (c.name || '').toLowerCase().indexOf(kw) >= 0 || (c.phone || '').indexOf(kw) >= 0 || (c.user_id || '').toLowerCase().indexOf(kw) >= 0;
    });
    if (!filtered.length) {
      custList.innerHTML = '<div class="inline-empty">未找到匹配客户</div>';
      custList.style.display = '';
      return;
    }
    custList.innerHTML = filtered.map(function (c, i) {
      return '<div class="inline-item" data-i="' + i + '"><div class="ii-main">' + esc(c.name) + ' · ' + esc(c.phone) + '</div><div class="ii-sub">' + esc(c.user_id) + ' · ' + esc(c.level) + '</div></div>';
    }).join('');
    custList.style.display = '';
    custList._data = filtered;
  }
  custSearch.addEventListener('input', function () { renderCust(custSearch.value); syncHeightLater(); });
  custList.addEventListener('click', function (e) {
    var item = e.target.closest('.inline-item');
    if (!item) return;
    var c = custList._data[parseInt(item.getAttribute('data-i'), 10)];
    if (!c) return;
    state.user_id = c.user_id;
    state.user_name = c.name + '(' + c.phone + ')';
    custSearch.value = state.user_name;
    custSearch.classList.add('filled');
    custList.style.display = 'none';
    custHint.innerHTML = '已选:' + esc(c.name) + ' · ' + esc(c.user_id) + ' <span class="ip-clear" onclick="clearCust()">清除重选</span>';
    /* 重置订单 + 渲染该客户订单 */
    state.order_id = '';
    renderOrders(c.user_id);
    syncHeightLater();
  });
  function clearCust() {
    state.user_id = ''; state.user_name = '';
    custSearch.value = ''; custSearch.classList.remove('filled');
    custHint.textContent = '输入关键词搜索客户';
    custList.style.display = 'none';
    document.getElementById('orderBox').textContent = '请先选择客户';
    document.getElementById('orderBox').style.color = 'var(--cs-text-placeholder)';
    document.getElementById('orderList').style.display = 'none';
    state.order_id = '';
    syncHeightLater();
  }
  window.clearCust = clearCust;

  /* —— 订单内联(选客户后展示该客户订单) —— */
  function renderOrders(uid) {
    var orderBox = document.getElementById('orderBox');
    var orderList = document.getElementById('orderList');
    var list = ORDERS.filter(function (o) { return o.user_id === uid; });
    if (!list.length) {
      orderBox.textContent = '该客户暂无订单(可留空创建无订单工单)';
      orderBox.style.color = 'var(--cs-text-tertiary)';
      orderList.style.display = 'none';
      return;
    }
    orderBox.textContent = '点击选择订单(可选,共 ' + list.length + ' 单)';
    orderBox.style.color = 'var(--cs-text-tertiary)';
    orderList.innerHTML = list.map(function (o, i) {
      return '<div class="inline-item" data-i="' + i + '"><div class="ii-main">' + esc(o.order_id) + ' · ' + esc(o.amount) + ' · ' + esc(o.state) + '</div><div class="ii-sub">' + esc(o.goods) + ' · ' + esc(o.time) + '</div></div>';
    }).join('');
    orderList.style.display = '';
    orderList._data = list;
  }
  document.getElementById('orderList').addEventListener('click', function (e) {
    var item = e.target.closest('.inline-item');
    if (!item) return;
    var ol = document.getElementById('orderList');
    var o = ol._data[parseInt(item.getAttribute('data-i'), 10)];
    if (!o) return;
    state.order_id = o.order_id;
    var orderBox = document.getElementById('orderBox');
    orderBox.textContent = o.order_id + ' · ' + o.goods + ' (' + o.amount + ')';
    orderBox.style.color = 'var(--cs-text)';
    orderBox.style.fontWeight = '500';
    ol.style.display = 'none';
    syncHeightLater();
  });

  function submit() {
    var title = document.getElementById('fTitle').value.trim();
    if (!title) { toast('请填写标题'); return; }
    if (standalone && !state.user_id) { toast('请选择客户'); return; }
    window.csModalBridge.confirm({
      title: title,
      type: document.getElementById('fType').value,
      priority: document.getElementById('fPriority').value,
      user_id: state.user_id,
      order_id: state.order_id,
      description: document.getElementById('fDesc').value.trim(),
      session_id: state.session_id
    });
  }
</script>
</body>
</html>

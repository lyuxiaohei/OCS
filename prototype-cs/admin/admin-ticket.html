<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工单系统 — CS 商城客服系统</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cs-bg-page);
      padding: 24px;
    }

    .placeholder-card {
      width: 520px;
      background: var(--cs-bg-card);
      border: 1px solid var(--cs-border-light);
      border-radius: 10px;
      padding: 40px 36px;
      text-align: center;
    }

    .status-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--cs-text-placeholder);
      margin: 0 auto 20px;
      display: block;
    }

    .ph-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--cs-text);
      margin: 0 0 6px;
    }

    .ph-phase {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--cs-success-bg);
      color: var(--cs-success);
      margin-bottom: 16px;
    }

    .ph-desc {
      font-size: 13px;
      color: var(--cs-text-tertiary);
      line-height: 1.7;
      margin: 0 0 20px;
    }

    .ph-features {
      text-align: left;
      background: var(--cs-bg-page);
      border: 1px solid var(--cs-border-lighter);
      border-radius: 6px;
      padding: 14px 18px;
      margin: 0;
    }
    .ph-features li {
      font-size: 12px;
      color: var(--cs-text-secondary);
      line-height: 2;
      list-style: none;
    }
    .ph-features li::before {
      content: '○';
      color: var(--cs-text-placeholder);
      margin-right: 8px;
    }

    .ph-back {
      display: inline-block;
      margin-top: 24px;
      font-size: 12px;
      color: var(--cs-primary);
      text-decoration: none;
    }
    .ph-back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="placeholder-card">
    <span class="status-dot"></span>
    <h1 class="ph-title">工单系统</h1>
    <span class="ph-phase">2期 · 待开发</span>
    <p class="ph-desc">
      该页面为占位原型，尚未实现。<br>
      工单用于跨部门流转处理用户问题，可从会话页/客户详情页创建。
    </p>
    <ul class="ph-features">
      <li>工单字段（标题/分类/描述/附件/优先级/指派人）</li>
      <li>状态流转（未分配→待处理→处理中→已解决→已关闭）</li>
      <li>工单操作（接单/转单/回复/加抄送）</li>
      <li>与我相关（待我处理/我创建的/抄送我的）</li>
      <li>消息联动（自动生成 / 一键生成）</li>
    </ul>
    <a class="ph-back" href="index.html">← 返回原型首页</a>
  </div>
</body>
</html>

<link rel="stylesheet" href="colors_and_type.css" />
<style>
/* --- Layout Shell --- */
.admin-layout {
  display: flex;
  min-height: 100vh;
  font-family: var(--cs-font-family);
  background: var(--cs-bg-page);
  color: var(--cs-text);
}

/* --- Sidebar --- */
.admin-sidebar {
  width: var(--cs-sidebar-width, 220px);
  min-width: var(--cs-sidebar-width, 220px);
  background: var(--cs-bg-sidebar, #001529);
  display: flex;
  flex-direction: column;
  height: 100vh;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 100;
  overflow-y: auto;
  overflow-x: hidden;
}

.admin-sidebar::-webkit-scrollbar {
  width: 4px;
}

.admin-sidebar::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.15);
  border-radius: 2px;
}

/* Logo */
.sidebar-logo {
  height: 56px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  flex-shrink: 0;
}

.sidebar-logo .logo-icon {
  width: 28px;
  height: 28px;
  background: var(--cs-primary, #1677ff);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 10px;
  flex-shrink: 0;
}

.sidebar-logo .logo-icon svg {
  width: 16px;
  height: 16px;
}

.sidebar-logo .logo-text {
  font-size: 16px;
  font-weight: 600;
  color: #ffffff;
  white-space: nowrap;
  letter-spacing: 0.5px;
}

/* Navigation */
.sidebar-nav {
  flex: 1;
  padding: 8px 0;
}

.nav-item {
  display: flex;
  align-items: center;
  padding: 10px 24px;
  font-size: 14px;
  color: var(--cs-sidebar-text, rgba(255,255,255,0.65));
  cursor: pointer;
  transition: var(--cs-transition-fast, all 0.15s ease);
  text-decoration: none;
  position: relative;
  user-select: none;
}

.nav-item:hover {
  color: var(--cs-sidebar-text-active, #ffffff);
  background: var(--cs-sidebar-item-hover, rgba(255,255,255,0.08));
}

.nav-item.active {
  color: var(--cs-primary, #1677ff);
  background: var(--cs-primary-bg, #e6f4ff);
}

.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--cs-primary, #1677ff);
  border-radius: 0 2px 2px 0;
}

.nav-item .nav-icon {
  width: 16px;
  height: 16px;
  margin-right: 10px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-item .nav-icon svg {
  width: 16px;
  height: 16px;
}

.nav-item .nav-label {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.nav-item .nav-arrow {
  width: 12px;
  height: 12px;
  transition: transform 0.2s ease;
  opacity: 0.5;
}

.nav-item .nav-arrow svg {
  width: 12px;
  height: 12px;
}

.nav-group-head.expanded .nav-arrow {
  transform: rotate(90deg);
}

/* Sub-items */
.nav-sub-items {
  overflow: hidden;
  max-height: 0;
  transition: max-height 0.25s ease;
}

.nav-sub-items.open {
  max-height: 200px;
}

.nav-sub-item {
  display: flex;
  align-items: center;
  padding: 8px 24px 8px 48px;
  font-size: 13px;
  color: var(--cs-sidebar-text, rgba(255,255,255,0.65));
  cursor: pointer;
  transition: var(--cs-transition-fast, all 0.15s ease);
  text-decoration: none;
  position: relative;
}

.nav-sub-item:hover {
  color: var(--cs-sidebar-text-active, #ffffff);
  background: var(--cs-sidebar-item-hover, rgba(255,255,255,0.08));
}

.nav-sub-item.active {
  color: var(--cs-primary, #1677ff);
  background: var(--cs-primary-bg, #e6f4ff);
}

.nav-sub-item.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--cs-primary, #1677ff);
  border-radius: 0 2px 2px 0;
}

.nav-sub-item .nav-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.5;
  margin-right: 10px;
  flex-shrink: 0;
}

.nav-sub-item.active .nav-dot {
  opacity: 1;
}

/* --- Right Content Area --- */
.admin-content-wrapper {
  flex: 1;
  margin-left: var(--cs-sidebar-width, 220px);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* --- Header --- */
.admin-header {
  height: var(--cs-header-height, 56px);
  background: var(--cs-bg-card, #ffffff);
  border-bottom: 1px solid var(--cs-border-light, #f0f0f0);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--cs-space-6, 24px);
  position: sticky;
  top: 0;
  z-index: 50;
  flex-shrink: 0;
}

.header-left {
  flex: 1;
  min-width: 0;
}

.header-right {
  display: flex;
  align-items: center;
  gap: var(--cs-space-4, 16px);
  flex-shrink: 0;
}

.breadcrumb-area {
  font-size: 14px;
  color: var(--cs-text-secondary, #595959);
}

.user-info {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: var(--cs-radius-sm, 6px);
  transition: var(--cs-transition-fast, all 0.15s ease);
}

.user-info:hover {
  background: var(--cs-bg-hover, #fafafa);
}

.user-status-badge {
  position: relative;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--cs-success, #52c41a);
}

.user-status-badge::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 50%;
  border: 1.5px solid var(--cs-bg-card, #ffffff);
}

.user-name {
  font-size: 14px;
  color: var(--cs-text, #1f1f1f);
  white-space: nowrap;
}

.user-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--cs-primary, #1677ff), var(--cs-purple, #722ed1));
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.user-avatar svg {
  width: 14px;
  height: 14px;
  color: #ffffff;
}

/* --- Main Content Area --- */
.admin-main {
  flex: 1;
  padding: var(--cs-space-6, 24px);
  overflow-y: auto;
}
</style>

      <div class="nav-sub-items">

    <!-- Header -->

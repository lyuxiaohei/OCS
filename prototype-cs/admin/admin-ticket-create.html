<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新建工单 — 客服模块</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="js/cs-modal.js"></script>
  <script src="js/ticket-dict.js"></script>
  <style>
    .fm-card { max-width: 920px; }
    .fm-card .section-head h3 { margin:0; }
    .fm-row { display:flex; gap:18px; margin-bottom:14px; flex-wrap:wrap; }
    .fm-field { display:flex; flex-direction:column; gap:6px; }
    .fm-field.flex1 { flex:1 1 200px; }
    .fm-field.flex2 { flex:2 1 320px; }
    .fm-label { font-size:var(--cs-font-size-sm); color:var(--cs-text-secondary); }
    .fm-label .req { color:var(--cs-danger); margin-left:2px; }
    .fm-label .opt { color:var(--cs-text-tertiary); font-weight:normal; margin-left:4px; }
    .fm-input, .fm-select, .fm-textarea { border:1px solid var(--cs-border); border-radius:var(--cs-radius-sm); padding:7px 10px; font-size:var(--cs-font-size-sm); font-family:inherit; background:#fff; outline:none; transition:border-color .2s; }
    .fm-input:focus, .fm-select:focus, .fm-textarea:focus { border-color:var(--cs-primary); box-shadow:0 0 0 2px rgba(22,119,255,0.1); }
    .fm-textarea { resize:vertical; min-height:90px; line-height:1.6; width:100%; }
    .fm-select { appearance:auto; }
    .readonly-field { background:var(--cs-bg-header); color:var(--cs-text-secondary); }
    .conditional { display:none; }
    .conditional.show { display:flex; }

    .ctx-box { background:var(--cs-primary-bg); border:1px solid #91caff; border-radius:var(--cs-radius-sm); padding:10px 14px; margin-bottom:var(--cs-space-4); font-size:var(--cs-font-size-sm); color:var(--cs-text-secondary); max-width:920px; }
    .ctx-box .ctx-title { color:var(--cs-primary); font-weight:var(--cs-font-weight-semibold); margin-bottom:6px; }
    .ctx-box .ctx-row { padding:2px 0; }
    .ctx-box .ctx-row b { color:var(--cs-text); font-weight:var(--cs-font-weight-medium); }

    .inline-pick { position:relative; }
    .inline-pick .ip-input { width:100%; border:1px solid var(--cs-border); border-radius:var(--cs-radius-sm); padding:7px 10px; font-size:var(--cs-font-size-sm); outline:none; background:#fff; }
    .inline-pick .ip-input.filled { background:var(--cs-primary-bg); color:var(--cs-text); font-weight:var(--cs-font-weight-medium); }
    .inline-pick .ip-input:focus { border-color:var(--cs-primary); }
    .inline-list { margin-top:6px; max-height:220px; overflow-y:auto; border:1px solid var(--cs-border-light); border-radius:var(--cs-radius-sm); }
    .inline-item { padding:8px 10px; cursor:pointer; border-bottom:1px solid var(--cs-border-lighter); font-size:var(--cs-font-size-sm); }
    .inline-item:last-child { border-bottom:none; }
    .inline-item:hover { background:var(--cs-primary-bg); }
    .inline-item.selected { background:var(--cs-primary-bg); }
    .inline-item .ii-main { color:var(--cs-text); display:flex; align-items:center; gap:6px; }
    .inline-item .ii-sub { color:var(--cs-text-tertiary); font-size:var(--cs-font-size-xs); margin-top:2px; }
    .inline-empty { padding:12px; text-align:center; font-size:var(--cs-font-size-xs); color:var(--cs-text-tertiary); }
    .ip-hint { margin-top:4px; font-size:var(--cs-font-size-xs); color:var(--cs-text-tertiary); }
    .ip-clear { margin-left:6px; color:var(--cs-text-tertiary); cursor:pointer; }
    .ip-clear:hover { color:var(--cs-danger); }
    .pick-chk { width:14px; height:14px; accent-color:var(--cs-primary); }

    .collapse-toggle { display:inline-block; font-size:var(--cs-font-size-xs); color:var(--cs-primary); cursor:pointer; }
    .collapse-toggle:hover { text-decoration:underline; }
    .collapsible { display:none; margin-top:10px; }
    .collapsible.open { display:block; }

    .fm-actions { max-width:920px; display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
  </style>
</head>
<body>
<div class="admin-layout">

  <aside class="admin-sidebar" id="sidebar-nav" data-active="ticket"></aside>

  <div style="flex:1; display:flex; flex-direction:column; min-width:0;">
    <header class="admin-header">
      <div class="breadcrumb">客服工单 / <a href="admin-ticket.html" style="color:var(--cs-primary);">工单列表</a> / <span style="color:var(--cs-text);font-weight:600;">新建工单</span></div>
      <div class="user-info">
        <span class="status-badge online">客服A 在线</span>
        <span style="font-size:var(--cs-font-size-base);color:var(--cs-text-secondary);">张小明</span>
      </div>
    </header>

    <main class="admin-content">

      <!-- 上下文(转工单 / 订单受理带入) -->
      <div class="ctx-box" id="ctxBox">
        <div class="ctx-title">已从会话自动带入</div>
        <div class="ctx-row">来源会话:<b>#CS20260716088</b> · 客户:<b>陈芳(138****2891)</b></div>
        <div class="ctx-row">关联订单:<b>#DD20260710003</b> · 会话摘要:退款未到账,客户催促</div>
      </div>

      <!-- 基本信息 -->
      <div class="card fm-card" style="padding:16px 18px; margin-bottom:16px;">
        <div class="section-head"><h3>基本信息</h3></div>
        <div class="fm-row">
          <div class="fm-field flex2">
            <label class="fm-label">标题<span class="req">*</span></label>
            <input class="fm-input" id="fTitle" placeholder="简述问题" />
          </div>
        </div>
        <div class="fm-row">
          <div class="fm-field flex1">
            <label class="fm-label">受理业务类型<span class="req">*</span></label>
            <select class="fm-select" id="fCategory"><option value="">请选择</option></select>
          </div>
          <div class="fm-field flex1 conditional" id="responsibleWrap">
            <label class="fm-label">责任承担方<span class="req">*</span><span class="opt">(投诉类必填)</span></label>
            <select class="fm-select" id="fResponsible"><option value="">请选择</option></select>
          </div>
        </div>
        <div class="fm-row">
          <div class="fm-field flex1">
            <label class="fm-label">咨询/投诉类别<span class="req">*</span></label>
            <select class="fm-select" id="fSubCategory"><option value="">请先选一级</option></select>
          </div>
          <div class="fm-field flex1">
            <label class="fm-label">具体类型<span class="req">*</span></label>
            <select class="fm-select" id="fType"><option value="">请先选二级</option></select>
          </div>
        </div>
        <div class="fm-row">
          <div class="fm-field flex1">
            <label class="fm-label">优先级</label>
            <select class="fm-select" id="fPriority">
              <option value="">请选择</option>
              <option>一般</option><option>紧急</option><option>特急</option>
            </select>
          </div>
          <div class="fm-field flex1">
            <label class="fm-label">完成期限</label>
            <select class="fm-select" id="fDeadline">
              <option value="">请选择</option>
              <option value="1天">1天</option><option value="7天">7天</option><option value="15天">15天</option>
            </select>
          </div>
        </div>
        <div class="fm-row" id="sourceRow" style="display:none;">
          <div class="fm-field flex1">
            <label class="fm-label">来源<span class="opt">(自定义,手动/批量建单选填)</span></label>
            <select class="fm-select" id="fSource">
              <option value="客服创建">客服创建</option>
              <option value="电话">电话</option>
              <option value="邮件">邮件</option>
              <option value="线下/其他">线下/其他</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 客户与订单 -->
      <div class="card fm-card" style="padding:16px 18px; margin-bottom:16px;">
        <div class="section-head"><h3>客户与订单</h3></div>
        <div class="fm-row">
          <div class="fm-field flex2">
            <label class="fm-label">客户<span class="req">*</span></label>
            <input class="fm-input readonly-field" id="fCustomerRO" style="display:none;" readonly />
            <div class="inline-pick" id="fCustomerPick" style="display:none;">
              <input class="ip-input" id="custSearch" placeholder="搜索 手机号 / 昵称 / 用户ID" autocomplete="off" />
              <div class="ip-hint" id="custHint">输入关键词搜索客户</div>
              <div class="inline-list" id="custList" style="display:none;"></div>
            </div>
          </div>
        </div>
        <div class="fm-row">
          <div class="fm-field flex2">
            <label class="fm-label">关联订单<span class="opt">(可选,可多选,1 对多)</span></label>
            <input class="fm-input readonly-field" id="fOrderRO" style="display:none;" readonly />
            <div class="inline-pick" id="fOrderPick" style="display:none;">
              <div class="ip-input" id="orderBox" style="cursor:default;color:var(--cs-text-placeholder);">请先选择客户</div>
              <div class="inline-list" id="orderList" style="display:none;"></div>
              <div style="margin-top:8px;display:flex;gap:6px;align-items:center;">
                <input class="fm-input" id="manualOrder" placeholder="手动输入订单号追加(UC-CT-11,老订单/无手机号)" style="flex:1;font-size:var(--cs-font-size-xs);" />
                <button class="btn-default" type="button" onclick="addManualOrder()" style="font-size:var(--cs-font-size-xs);padding:5px 10px;flex-shrink:0;">追加</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 联系方式 -->
      <div class="card fm-card" style="padding:16px 18px; margin-bottom:16px;">
        <div class="section-head"><h3>联系方式<span style="font-size:var(--cs-font-size-xs);color:var(--cs-text-tertiary);font-weight:normal;margin-left:6px;">默认取订单收货,可改</span></h3></div>
        <div class="fm-row">
          <div class="fm-field flex1"><label class="fm-label">联系人</label><input class="fm-input" id="fContactName" placeholder="联系人姓名" /></div>
          <div class="fm-field flex1"><label class="fm-label">移动电话</label><input class="fm-input" id="fContactPhone" placeholder="移动电话" /></div>
        </div>
        <div class="fm-row">
          <div class="fm-field flex1"><label class="fm-label">座机电话</label><input class="fm-input" id="fContactTel" placeholder="座机电话" /></div>
          <div class="fm-field flex1"><label class="fm-label">来电电话</label><input class="fm-input" id="fIncomingCall" placeholder="来电电话" /></div>
        </div>
        <div class="fm-row">
          <div class="fm-field flex2"><label class="fm-label">联系地址</label><input class="fm-input" id="fContactAddr" placeholder="联系地址" /></div>
        </div>
        <a class="collapse-toggle" id="newContactToggle">+ 新联系人信息(收货人以外的实际联系人)</a>
        <div class="collapsible" id="newContactBox">
          <div class="fm-row" style="margin-top:8px;">
            <div class="fm-field flex1"><input class="fm-input" id="fNewName" placeholder="新联系人" /></div>
            <div class="fm-field flex1"><input class="fm-input" id="fNewPhone" placeholder="新移动电话" /></div>
          </div>
          <div class="fm-row">
            <div class="fm-field flex1"><input class="fm-input" id="fNewTel" placeholder="新座机电话" /></div>
            <div class="fm-field flex1"><input class="fm-input" id="fNewAddr" placeholder="新联系地址" /></div>
          </div>
        </div>
      </div>

      <!-- 业务字段 -->
      <div class="card fm-card" style="padding:16px 18px; margin-bottom:16px;">
        <div class="section-head"><h3>业务字段</h3></div>
        <div class="fm-row">
          <div class="fm-field flex1">
            <label class="fm-label">具体项目名称<span class="req">*</span></label>
            <input class="fm-input" id="fProject" placeholder="如(兆点)苏宁邮政项目" />
          </div>
          <div class="fm-field flex1">
            <label class="fm-label">反馈方式<span class="req">*</span></label>
            <select class="fm-select" id="fFeedback">
              <option value="">请选择</option>
              <option>电话</option><option>短信</option><option>业务口</option><option>合作商平台</option><option>合作商邮件</option>
            </select>
          </div>
        </div>
        <div class="fm-row">
          <div class="fm-field flex1">
            <label class="fm-label">工单提交部门<span class="req">*</span></label>
            <select class="fm-select" id="fDept">
              <option value="">请选择</option>
              <option>客服部</option><option>商品部</option><option>商务部</option>
            </select>
          </div>
          <div class="fm-field flex1">
            <label class="fm-label">是否二次投诉</label>
            <select class="fm-select" id="fSecondary"><option value="否">否</option><option value="是">是</option></select>
          </div>
        </div>
      </div>

      <!-- 工单描述 -->
      <div class="card fm-card" style="padding:16px 18px; margin-bottom:16px;">
        <div class="section-head"><h3>工单描述</h3></div>
        <textarea class="fm-textarea" id="fDesc" placeholder="详细描述问题"></textarea>
      </div>

      <div class="fm-actions">
        <button class="btn-default" onclick="location.href='admin-ticket.html'">取消</button>
        <button class="btn-primary" onclick="submit()">创建工单</button>
      </div>

    </main>
  </div>
</div>

<script src="js/cs-icons.js"></script>
<script src="nav.js"></script>
<script>
  function toast(t) { try { if (window.csModal && csModal.toast) csModal.toast(t); else alert(t); } catch (e) { alert(t); } }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }

  /* V0.5 字典统一引用 js/ticket-dict.js */
  var CATEGORY_TREE = window.TICKET_DICT.CATEGORY_TREE;
  var RESPONSIBLE_PARTIES = window.TICKET_DICT.RESPONSIBLE_PARTIES;
  function fillSelect(sel, arr, placeholder) {
    sel.innerHTML = '<option value="">' + placeholder + '</option>' + arr.map(function (o) { return '<option>' + o + '</option>'; }).join('');
  }
  var fCategory = document.getElementById('fCategory');
  var fSubCategory = document.getElementById('fSubCategory');
  var fType = document.getElementById('fType');
  var fResponsible = document.getElementById('fResponsible');
  fillSelect(fCategory, Object.keys(CATEGORY_TREE), '请选择');
  fillSelect(fResponsible, RESPONSIBLE_PARTIES, '请选择');
  fCategory.addEventListener('change', function () {
    var subs = Object.keys(CATEGORY_TREE[this.value] || {});
    fillSelect(fSubCategory, subs, subs.length ? '请选择' : '请先选一级');
    fillSelect(fType, [], '请先选二级');
    document.getElementById('responsibleWrap').classList.toggle('show', this.value === '投诉业务');
    if (this.value !== '投诉业务') fResponsible.value = '';
  });
  fSubCategory.addEventListener('change', function () {
    var types = (CATEGORY_TREE[fCategory.value] || {})[this.value] || [];
    fillSelect(fType, types, types.length ? '请选择' : '请先选二级');
  });

  var ncb = document.getElementById('newContactBox');
  document.getElementById('newContactToggle').addEventListener('click', function () {
    var open = ncb.classList.toggle('open');
    this.textContent = (open ? '－ ' : '+ ') + '新联系人信息(收货人以外的实际联系人)';
  });

  /* mock 数据(1 期;正式:客户搜索 customer/search + 按客户查订单 customer/orders) */
  var CUSTOMERS = [
    { user_id:'U20260710001', name:'陈芳',   phone:'138****2891', level:'黄金会员' },
    { user_id:'U20260710002', name:'刘洋',   phone:'139****5678', level:'普通会员' },
    { user_id:'U20260710003', name:'周婷婷', phone:'137****1024', level:'白银会员' },
    { user_id:'U20260710004', name:'赵磊',   phone:'135****8821', level:'黄金会员' },
    { user_id:'U20260710006', name:'陈思雨', phone:'186****0452', level:'VIP' }
  ];
  var ORDERS = [
    { user_id:'U20260710001', order_id:'#DD20260710003', goods:'无线蓝牙耳机(黑色)', amount:'¥299', time:'2026-07-10', state:'已签收' },
    { user_id:'U20260710001', order_id:'#DD20260708001', goods:'不锈钢保温杯 500ml', amount:'¥89', time:'2026-07-08', state:'已完成' },
    { user_id:'U20260710002', order_id:'#DD20260712001', goods:'男士跑步鞋 42码', amount:'¥459', time:'2026-07-12', state:'待发货' },
    { user_id:'U20260710004', order_id:'#DD20260711001', goods:'羽绒被 1.8m', amount:'¥699', time:'2026-07-11', state:'已签收' }
  ];

  var state = { user_id:'', user_name:'', order_ids:[], session_id:'' };
  var mode = new URLSearchParams(location.search).get('mode') || 'session';
  var standalone = mode === 'standalone';
  var orderMode = mode === 'order';
  var batchMode = mode === 'batch';

  if (standalone) {
    document.getElementById('ctxBox').style.display = 'none';
    document.getElementById('fCustomerPick').style.display = '';
    document.getElementById('fOrderPick').style.display = '';
    document.getElementById('sourceRow').style.display = '';
  } else if (orderMode) {
    var p = new URLSearchParams(location.search);
    var oid = p.get('oid') || '', goods = p.get('goods') || '', phone = p.get('phone') || '', amount = p.get('amount') || '', ostate = p.get('state') || '';
    var project = p.get('project') || '', receiver = p.get('receiver') || '', raddr = p.get('raddr') || '';
    var ctxBox = document.getElementById('ctxBox');
    ctxBox.style.display = '';
    ctxBox.innerHTML = '<div class="ctx-title">已从订单带入(创建工单)</div>'
      + '<div class="ctx-row">关联订单:<b>' + esc(oid) + '</b> · 商品:<b>' + esc(goods) + '</b> · ' + esc(amount) + '</div>'
      + '<div class="ctx-row">客户:<b>' + esc(phone) + '</b> · 收货人:<b>' + esc(receiver) + '</b> · ' + esc(raddr) + '</div>'
      + '<div class="ctx-row">项目:<b>' + esc(project) + '</b> · 订单状态:' + esc(ostate) + '</div>';
    document.getElementById('fCustomerRO').style.display = '';
    document.getElementById('fOrderRO').style.display = '';
    document.getElementById('fCustomerRO').value = receiver ? (receiver + '(' + phone + ')') : (phone || '(订单未关联客户)');
    document.getElementById('fOrderRO').value = oid + (goods ? ' · ' + goods : '') + (amount ? ' (' + amount + ')' : '');
    document.getElementById('fTitle').value = goods ? ('订单售后 - ' + goods) : '';
    document.getElementById('fContactName').value = receiver;
    document.getElementById('fContactPhone').value = phone;
    document.getElementById('fContactAddr').value = raddr;
    document.getElementById('fProject').value = project;
    state.user_name = receiver ? (receiver + '(' + phone + ')') : (phone || '(订单未关联客户)');
    state.order_ids = oid ? [oid] : [];
  } else if (batchMode) {
    /* 批量创建工单:所选订单合并为一张(工单-订单 1 对多),不限制客户 */
    var bp = new URLSearchParams(location.search);
    var boids = (bp.get('oids') || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    var bctx = document.getElementById('ctxBox');
    bctx.style.display = '';
    bctx.innerHTML = '<div class="ctx-title">已批量带入 ' + boids.length + ' 个订单 · 合并为一张工单(不限制客户)</div>'
      + '<div class="ctx-row">关联订单:<b>' + esc(boids.join(' · ')) + '</b></div>'
      + '<div class="ctx-row">请在下方补充分类 / 描述后提交;多单关联为工单-订单 1 对多</div>';
    document.getElementById('fCustomerRO').style.display = '';
    document.getElementById('fOrderRO').style.display = '';
    document.getElementById('fCustomerRO').value = '(' + boids.length + ' 个订单批量创建,提交时绑定客户)';
    document.getElementById('fOrderRO').value = boids.join(' · ') + ' (' + boids.length + ' 单)';
    document.getElementById('fTitle').value = '批量售后 - ' + boids.length + ' 个订单';
    document.getElementById('sourceRow').style.display = '';
    state.order_ids = boids.slice();
  } else {
    /* 转工单(session)默认带入 */
    document.getElementById('fCustomerRO').style.display = '';
    document.getElementById('fOrderRO').style.display = '';
    document.getElementById('fCustomerRO').value = '陈芳(138****2891)';
    document.getElementById('fOrderRO').value = '#DD20260710003 · 无线蓝牙耳机(黑色) (¥299)';
    document.getElementById('fTitle').value = '订单退款两天未到账';
    document.getElementById('fDesc').value = '客户反馈订单 #DD20260710003 的退款申请于 7/14 提交,两天未到账,情绪激动。';
    document.getElementById('fContactName').value = '陈芳';
    document.getElementById('fContactPhone').value = '138****2891';
    document.getElementById('fContactAddr').value = '南京市玄武区苏宁大道1号';
    document.getElementById('fProject').value = '(兆点)苏宁邮政项目';
    state.user_id = 'U20260710001'; state.user_name = '陈芳(138****2891)';
    state.order_ids = ['#DD20260710003']; state.session_id = '#CS20260716088';
  }

  /* 客户内联搜索 */
  var custSearch = document.getElementById('custSearch');
  var custList = document.getElementById('custList');
  var custHint = document.getElementById('custHint');
  function renderCust(kw) {
    kw = (kw || '').trim().toLowerCase();
    var filtered = CUSTOMERS.filter(function (c) {
      if (!kw) return false;
      return (c.name || '').toLowerCase().indexOf(kw) >= 0 || (c.phone || '').indexOf(kw) >= 0 || (c.user_id || '').toLowerCase().indexOf(kw) >= 0;
    });
    if (!filtered.length) { custList.innerHTML = '<div class="inline-empty">未找到匹配客户</div>'; custList.style.display = ''; return; }
    custList.innerHTML = filtered.map(function (c, i) {
      return '<div class="inline-item" data-i="' + i + '"><div class="ii-main">' + esc(c.name) + ' · ' + esc(c.phone) + '</div><div class="ii-sub">' + esc(c.user_id) + ' · ' + esc(c.level) + '</div></div>';
    }).join('');
    custList.style.display = '';
    custList._data = filtered;
  }
  custSearch.addEventListener('input', function () { renderCust(custSearch.value); });
  custList.addEventListener('click', function (e) {
    var item = e.target.closest('.inline-item'); if (!item) return;
    var c = custList._data[parseInt(item.getAttribute('data-i'), 10)]; if (!c) return;
    state.user_id = c.user_id; state.user_name = c.name + '(' + c.phone + ')';
    custSearch.value = state.user_name; custSearch.classList.add('filled'); custList.style.display = 'none';
    custHint.innerHTML = '已选:' + esc(c.name) + ' · ' + esc(c.user_id) + ' <span class="ip-clear" onclick="clearCust()">清除重选</span>';
    state.order_ids = []; renderOrders(c.user_id);
  });
  function clearCust() {
    state.user_id = ''; state.user_name = '';
    custSearch.value = ''; custSearch.classList.remove('filled');
    custHint.textContent = '输入关键词搜索客户'; custList.style.display = 'none';
    var orderBox = document.getElementById('orderBox');
    orderBox.textContent = '请先选择客户'; orderBox.style.color = 'var(--cs-text-placeholder)';
    document.getElementById('orderList').style.display = 'none'; state.order_ids = [];
  }
  window.clearCust = clearCust;

  /* 订单多选 + 手动追加 */
  function renderOrders(uid) {
    var orderBox = document.getElementById('orderBox');
    var orderList = document.getElementById('orderList');
    var list = ORDERS.filter(function (o) { return o.user_id === uid; });
    if (!list.length) {
      orderBox.textContent = '该客户暂无订单(可留空或手动输入订单号)'; orderBox.style.color = 'var(--cs-text-tertiary)'; orderList.style.display = 'none'; return;
    }
    orderList._data = list; renderOrderSummary();
    orderList.innerHTML = list.map(function (o, i) {
      var checked = state.order_ids.indexOf(o.order_id) >= 0 ? ' selected' : '';
      return '<div class="inline-item' + checked + '" data-i="' + i + '"><div class="ii-main"><input class="pick-chk" type="checkbox" ' + (checked ? 'checked' : '') + ' />' + esc(o.order_id) + ' · ' + esc(o.amount) + ' · ' + esc(o.state) + '</div><div class="ii-sub">' + esc(o.goods) + ' · ' + esc(o.time) + '</div></div>';
    }).join('');
    orderList.style.display = '';
  }
  function renderOrderSummary() {
    var orderBox = document.getElementById('orderBox');
    var ids = state.order_ids;
    if (!ids.length) { orderBox.textContent = '点击下方订单勾选(可多选,1 对多)'; orderBox.style.color = 'var(--cs-text-tertiary)'; }
    else { orderBox.textContent = '已选 ' + ids.length + ' 单:' + ids.join(', '); orderBox.style.color = 'var(--cs-text)'; orderBox.style.fontWeight = '500'; }
  }
  document.getElementById('orderList').addEventListener('click', function (e) {
    var item = e.target.closest('.inline-item'); if (!item) return;
    var ol = document.getElementById('orderList');
    var o = ol._data[parseInt(item.getAttribute('data-i'), 10)]; if (!o) return;
    var idx = state.order_ids.indexOf(o.order_id);
    if (idx >= 0) state.order_ids.splice(idx, 1); else state.order_ids.push(o.order_id);
    var chk = item.querySelector('.pick-chk'); if (chk) chk.checked = idx < 0;
    item.classList.toggle('selected', idx < 0);
    renderOrderSummary();
  });
  function addManualOrder() {
    var inp = document.getElementById('manualOrder');
    var v = inp.value.trim();
    if (!v) { toast('请输入订单号'); return; }
    if (state.order_ids.indexOf(v) < 0) state.order_ids.push(v);
    inp.value = ''; renderOrderSummary();
  }
  window.addManualOrder = addManualOrder;

  function submit() {
    var title = document.getElementById('fTitle').value.trim();
    if (!title) { toast('请填写标题'); return; }
    if (!fCategory.value) { toast('请选择受理业务类型'); return; }
    if (!fSubCategory.value) { toast('请选择咨询/投诉类别'); return; }
    if (!fType.value) { toast('请选择具体类型'); return; }
    if (fCategory.value === '投诉业务' && !fResponsible.value) { toast('投诉类请选择责任承担方'); return; }
    if (standalone && !state.user_id) { toast('请选择客户'); return; }
    if (!document.getElementById('fProject').value.trim()) { toast('请填写项目名称'); return; }
    if (!document.getElementById('fFeedback').value) { toast('请选择反馈方式'); return; }
    if (!document.getElementById('fDept').value) { toast('请选择提交部门'); return; }
    /* 提交(原型:提示后回列表) */
    toast('工单已创建:' + title);
    setTimeout(function () { location.href = 'admin-ticket.html'; }, 500);
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>帮助中心 — CS 商城客服系统</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="mobile.css" />
  <script src="js/cs-common.js"></script>
  <style>
    /* ===== user-faq.html 专属样式 ===== */

    /* 兼容 help.html 的 contact-section 变量（取自 mini-program/common.css，确保样式一模一样） */
    :root {
      --card-bg: #fff;
      --space-sm: 8px;
      --space-md: 12px;
      --space-lg: 16px;
      --radius-md: 12px;
      --radius-xl: 24px;
      --font-sm: 12px;
      --font-base: 14px;
      --font-md: 16px;
      --text-color: #333;
      --text-tertiary: #999;
      --primary-start: #ff6034;
      --price-color: #ee0a24;
    }

    body {
      background: var(--cs-bg-page);
      min-height: 100vh;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 顶部说明条（页面级，非手机内部） */
    .page-wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: var(--cs-space-6) var(--cs-space-4);
    }
    .page-title {
      text-align: center;
      color: var(--cs-text);
      font-size: var(--cs-font-size-lg);
      font-weight: var(--cs-font-weight-semibold);
      margin-bottom: 3px;
    }
    .page-subtitle {
      text-align: center;
      color: var(--cs-text-tertiary);
      font-size: var(--cs-font-size-sm);
      margin-bottom: var(--cs-space-4);
    }

    /* 搜索框（手机内顶部） */
    .faq-search {
      display: flex;
      align-items: center;
      background: var(--cs-bg-card);
      border-radius: 18px;
      padding: 0 var(--cs-space-3);
      height: 36px;
      flex: 1;
      border: 1px solid var(--cs-border-light);
    }
    .faq-search input {
      flex: 1;
      border: none;
      outline: none;
      font-size: var(--cs-font-size-base);
      background: transparent;
      color: var(--cs-text);
    }
    .faq-search input::placeholder { color: var(--cs-text-placeholder); }
    .faq-search .search-icon { color: var(--cs-text-tertiary); margin-right: var(--cs-space-2); display: inline-flex; align-items: center; }

    /* 分类标签栏 */
    .faq-tabs {
      display: flex;
      gap: var(--cs-space-2);
      padding: 10px var(--cs-space-3) 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--cs-bg-header);
      border-bottom: 1px solid var(--cs-border-light);
      flex-shrink: 0;
      scrollbar-width: none;
    }
    .faq-tabs::-webkit-scrollbar { display: none; }
    .faq-tab {
      flex-shrink: 0;
      padding: 5px var(--cs-space-3);
      border-radius: 14px;
      background: var(--cs-bg-card);
      border: 1px solid #e8e8e8;
      font-size: var(--cs-font-size-sm);
      color: var(--cs-text-secondary);
      cursor: pointer;
      transition: var(--cs-transition-normal);
      white-space: nowrap;
    }
    .faq-tab:hover { border-color: var(--cs-primary); color: var(--cs-primary); }
    .faq-tab.active {
      background: var(--cs-primary);
      border-color: var(--cs-primary);
      color: #fff;
      font-weight: var(--cs-font-weight-medium);
    }

    /* FAQ 列表 */
    .faq-list {
      flex: 1;
      overflow-y: auto;
      padding: var(--cs-space-3);
      display: flex;
      flex-direction: column;
      gap: var(--cs-space-2);
      background: #ededed;
    }
    .faq-item {
      background: var(--cs-bg-card);
      border-radius: var(--cs-radius-md);
      padding: var(--cs-space-3) 14px;
      cursor: pointer;
      transition: var(--cs-transition-normal);
      border: 1px solid transparent;
    }
    .faq-item:hover { border-color: var(--cs-border-light); }
    .faq-item.expanded {
      border-color: var(--cs-primary);
      box-shadow: 0 2px 8px rgba(238, 10, 36,0.08);
    }
    .faq-item-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .faq-question {
      flex: 1;
      font-size: var(--cs-font-size-md);
      color: var(--cs-text);
      font-weight: var(--cs-font-weight-medium);
      line-height: 1.5;
    }
    .faq-hit {
      display: none;
    }
    .faq-hit .fire { display: inline-flex; align-items: center; }

    /* 答案气泡（展开时显示） */
    .faq-answer {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--cs-border-light);
    }
    .faq-item.expanded .faq-answer { display: block; }
    .faq-answer-bubble {
      position: relative;
      background: #f6ffed;
      border: 1px solid #d9f7be;
      border-left: 3px solid var(--cs-success);
      border-radius: var(--cs-radius-md);
      padding: 12px var(--cs-space-3) 12px 14px;
      font-size: var(--cs-font-size-base);
      color: var(--cs-text);
      line-height: 1.7;
    }
    .faq-answer-bubble .label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 18px;
      font-size: var(--cs-font-size-xs);
      color: #fff;
      background: var(--cs-success);
      border-radius: 9px;
      padding: 0 7px;
      margin-bottom: 8px;
      font-weight: var(--cs-font-weight-semibold);
      letter-spacing: 0.5px;
    }
    .faq-answer-actions {
      display: flex;
      gap: var(--cs-space-2);
      margin-top: 10px;
    }
    .faq-answer-actions button {
      flex: 1;
      padding: 6px 0;
      border-radius: var(--cs-radius-sm);
      border: 1px solid var(--cs-border);
      background: var(--cs-bg-card);
      color: var(--cs-text-secondary);
      font-size: var(--cs-font-size-sm);
      cursor: pointer;
      transition: var(--cs-transition-normal);
    }
    .faq-answer-actions button:hover { border-color: var(--cs-primary); color: var(--cs-primary); }
    .faq-answer-actions .useful {
      background: var(--cs-primary);
      border-color: var(--cs-primary);
      color: #fff;
    }
    .faq-answer-actions .useful:hover { background: var(--cs-primary-hover); }

    /* （热度展示已移除：HOT 角标与右侧热度数字均不再显示） */

    /* 底部联系客服区块（与 help.html 完全一致，原样复制不修改） */
    /* Contact */
    .contact-section {
      background: var(--card-bg);
      margin: var(--space-md);
      border-radius: var(--radius-md);
      padding: var(--space-md);
      text-align: center;
    }
    .contact-title {
      font-size: var(--font-md);
      font-weight: 600;
      color: var(--text-color);
      margin-bottom: 4px;
    }
    .contact-desc {
      font-size: var(--font-sm);
      color: var(--text-tertiary);
      margin-bottom: var(--space-md);
    }
    .btn-contact {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, var(--primary-start), var(--price-color));
      color: var(--card-bg);
      padding: 8px 20px;
      border-radius: var(--radius-xl);
      font-size: 13px;
      font-weight: 500;
      border: none;
      cursor: pointer;
    }
    .btn-contact:active { opacity: 0.85; }
    .btn-contact svg { width: 18px; height: 18px; }

    /* 排版小标题 */
    .faq-section-label {
      font-size: var(--cs-font-size-xs);
      color: var(--cs-text-tertiary);
      padding: 8px var(--cs-space-1) var(--cs-space-1);
      letter-spacing: 0.5px;
    }

    /* （顶部「常见问题 | 服务指南」Tab 已移除：合并进下方分类导航） */

    /* ===== Content Panels ===== */
    .content-panel { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .content-panel.active { display: flex; }

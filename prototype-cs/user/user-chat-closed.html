<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>会话关闭提示 — CS 商城客服系统</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="mobile.css" />
  <style>
    /* ===== user-chat-closed.html 专属样式 ===== */
    body {
      background: var(--cs-bg-page);
      padding: var(--cs-space-6) 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-caption {
      text-align: center;
      margin: 0 auto var(--cs-space-3);
      color: var(--cs-text-tertiary);
      font-size: var(--cs-font-size-sm);
    }
    .page-caption strong { color: var(--cs-text); font-size: var(--cs-font-size-lg); font-weight: var(--cs-font-weight-semibold); }

    /* ============ 导航栏 ============ */
    .nav-peer {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .agent-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #bfbfbf, #8c8c8c);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--cs-font-size-sm);
      font-weight: var(--cs-font-weight-semibold);
      flex-shrink: 0;
    }
    .peer-info { display: flex; flex-direction: column; min-width: 0; }
    .peer-name {
      font-size: var(--cs-font-size-md);
      font-weight: var(--cs-font-weight-semibold);
      color: var(--cs-text);
      line-height: 1.2;
    }
    .peer-status {
      font-size: var(--cs-font-size-xs);
      line-height: 1.2;
      color: var(--cs-text-tertiary);
    }

    /* ============ 关闭提示条（核心：灰色已结束态） ============ */
    .closed-banner {
      height: 36px;
      background: #f5f5f5;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: var(--cs-font-size-sm);
      color: var(--cs-text-tertiary);
      flex-shrink: 0;
    }
    .closed-banner .cl-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #bfbfbf;
      flex-shrink: 0;
    }

    /* ============ 消息列表 ============ */
    .msg-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      align-items: flex-end;
    }
    .msg-row.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 34px; height: 34px;
      border-radius: 6px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--cs-font-size-md);
      font-weight: var(--cs-font-weight-semibold);
      color: #fff;
    }
    .msg-avatar.agent {
      background: linear-gradient(135deg, #bfbfbf, #8c8c8c);
    }
    .msg-avatar.user {
      background: linear-gradient(135deg, var(--cs-success), var(--cs-success-hover));
    }
    .msg-content {
      max-width: 252px;
      display: flex;
      flex-direction: column;
    }
    .msg-row.user .msg-content { align-items: flex-end; }
    .msg-content .msg-bubble-agent,
    .msg-content .msg-bubble-user {
      box-shadow: 0 1px 1px rgba(0,0,0,0.04);
    }
    .msg-meta {
      font-size: var(--cs-font-size-xs);
      color: var(--cs-text-placeholder);
      margin: 2px 4px 0;
    }
    .msg-system {
      align-self: center;
      background: rgba(0,0,0,0.10);
      color: #fff;
      font-size: var(--cs-font-size-xs);
      padding: 3px 10px;
      border-radius: var(--cs-radius-xs);
      margin: 4px auto;
      text-align: center;
    }

    /* ============ 会话内评价卡片（与 user-chat-basic.html 一致） ============ */
    .msg-rating-card {
      width: 252px;
      background: var(--cs-bg-card);
      border: 1px solid var(--cs-border-light);
      border-radius: var(--cs-radius-lg);
      box-shadow: var(--cs-shadow-md);
      padding: 14px;
    }
    .msg-rating-card .rc-title {
      font-size: var(--cs-font-size-base);
      font-weight: var(--cs-font-weight-semibold);
      color: var(--cs-text);
      margin-bottom: 2px;
    }
    .msg-rating-card .rc-sub {
      font-size: var(--cs-font-size-xs);
      color: var(--cs-text-tertiary);
      margin-bottom: 10px;
    }
    .msg-rating-card .rc-stars {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
    }
    .msg-rating-card .rc-star {
      font-size: 28px;
      color: #d9d9d9;
      cursor: pointer;
      line-height: 1;
      transition: color .15s;
    }
    .msg-rating-card .rc-star.active { color: #faad14; }
    .msg-rating-card .rc-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .msg-rating-card .rc-tag {
      font-size: var(--cs-font-size-xs);
      padding: 4px 10px;
      border: 1px solid var(--cs-border-light);
      border-radius: 12px;
      color: var(--cs-text-secondary);
      cursor: pointer;
      transition: all .15s;
    }
    .msg-rating-card .rc-tag.active {
      background: var(--cs-primary-bg);
      border-color: var(--cs-primary);
      color: var(--cs-primary);
    }
    .msg-rating-card .rc-submit {
      width: 100%;
      padding: 8px;
      background: var(--cs-primary);
      color: #fff;
      border: none;
      border-radius: var(--cs-radius-sm);
      font-size: var(--cs-font-size-base);
      font-weight: var(--cs-font-weight-medium);
      cursor: pointer;
      font-family: inherit;
      transition: opacity .15s;
    }
    .msg-rating-card .rc-submit:disabled {
      background: #d9d9d9;
      cursor: not-allowed;
    }
    .msg-rating-card .rc-thanks {
      display: none;
      margin-top: 10px;
      padding: 8px;
      background: #f6ffed;
      border: 1px solid #b7eb8f;
      border-radius: var(--cs-radius-sm);
      color: var(--cs-success);
      font-size: var(--cs-font-size-sm);
      text-align: center;
    }
    .msg-rating-card.done .rc-thanks { display: block; }
    .msg-rating-card.done .rc-star,
    .msg-rating-card.done .rc-tag,
    .msg-rating-card.done .rc-submit {
      pointer-events: none;
    }

    /* ============ 底部操作区（会话已关闭：重新咨询 + 返回） ============ */
    .closed-actions {
      height: 64px;
      background: #f7f7f7;
      border-top: 1px solid #dcdcdc;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
      flex-shrink: 0;
    }
    .closed-actions .ca-btn {
      flex: 1;
      height: 38px;
      border-radius: var(--cs-radius-sm);
      font-size: var(--cs-font-size-sm);
      font-weight: var(--cs-font-weight-medium);
      cursor: pointer;
      font-family: inherit;
      transition: background .15s, color .15s;
    }
    .closed-actions .ca-btn.secondary {
      background: #fff;
      color: var(--cs-text-secondary);
      border: 1px solid var(--cs-border-light);
    }
    .closed-actions .ca-btn.secondary:hover { background: #fafafa; }
    .closed-actions .ca-btn.primary {
      background: var(--cs-primary);
      color: #fff;
      border: 1px solid var(--cs-primary);
    }
    .closed-actions .ca-btn.primary:hover { background: var(--cs-primary-hover); }

    /* Toast */
    .cs-toast {
      position: absolute;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 8px 16px;
      border-radius: var(--cs-radius-md);
      font-size: var(--cs-font-size-sm);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
      z-index: 99;
      white-space: nowrap;
    }
    .cs-toast.show { opacity: 1; }
  </style>
</head>
<body>

  <p class="page-caption"><strong>用户端 · 会话关闭提示</strong> &nbsp;|&nbsp;会话结束 + 评价引导 + 重新咨询</p>

  <!-- ===== 移动端容器 (375px) ===== -->
  <div class="cs-phone">

    <!-- 小程序状态栏 -->
    <div class="cs-status-bar">
      <span class="sb-time">09:41</span>
      <div class="sb-icons">
        <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
      </div>
    </div>

    <!-- 小程序导航栏 -->
    <div class="cs-nav-bar">
      <div class="cs-back" title="返回" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </div>
      <div class="nav-peer">
        <div class="agent-avatar">王</div>
        <div class="peer-info">
          <span class="peer-name">客服 王小明</span>
          <span class="peer-status">会话已结束</span>
        </div>
      </div>
      <div class="cs-capsule" title="微信胶囊">
        <svg viewBox="0 0 2808 1024" xmlns="http://www.w3.org/2000/svg"><path d="M2296.677184 1023.997952h-1784.679086a511.998098 511.998098 0 0 1-362.026541-874.024639A508.633539 508.633539 0 0 1 511.998098 0.001755h1784.679086a511.998098 511.998098 0 0 1 362.026541 874.02464A508.662796 508.662796 0 0 1 2296.677184 1023.997952z m-1784.679086-994.739162a482.741064 482.741064 0 0 0 0 965.482128h1784.679086a482.741064 482.741064 0 1 0 0-965.482128z"/><path d="M614.397718 492.075813a120.890065 117.78882 90 1 0 235.577639 0 120.890065 117.78882 90 1 0-235.577639 0Z"/><path d="M483.531004 508.225696m-78.52588 0a78.52588 78.52588 0 1 0 157.05176 0 78.52588 78.52588 0 1 0-157.05176 0Z"/><path d="M967.822691 495.147802m-65.447986 0a65.447985 65.447985 0 1 0 130.895971 0 65.447985 65.447985 0 1 0-130.895971 0Z"/><path d="M2065.400329 370.512836a145.934087 145.934087 0 0 0-145.758545 145.758545 145.934087 145.934087 0 0 0 145.758545 145.758544 145.934087 145.934087 0 0 0 145.758544-145.758544 145.934087 145.934087 0 0 0-145.758544-145.758545m0-117.028136a262.786681 262.786681 0 1 1 0 525.573362 262.786681 262.786681 0 0 1 0-525.573362z" fill="#000"/><path d="M2070.374024 521.332848m-91.633031 0a91.633031 91.633031 0 1 0 183.266062 0 91.633031 91.633031 0 1 0-183.266062 0Z"/><path d="M1404.337641 204.800995h29.257034v585.140684h-29.257034z"/></svg>
      </div>
    </div>

    <!-- ============ 关闭提示条 ============ -->
    <div class="closed-banner">
      <span class="cl-dot"></span>
      <span>本次会话已结束</span>
    </div>

    <!-- ============ 消息列表 ============ -->
    <div class="chat-messages" id="chatMessages">
      <div class="msg-system">— 已为您接入在线客服 · 订单咨询 —</div>

      <!-- 历史对话片段 -->
      <div class="msg-row user">
        <div class="msg-avatar user">我</div>
        <div class="msg-content">
          <div class="msg-bubble-user">您好，订单 JS20260408002 什么时候发货？</div>
          <div class="msg-meta">10:24</div>
        </div>
      </div>

      <div class="msg-row">
        <div class="msg-avatar agent">王</div>
        <div class="msg-content">
          <div class="msg-bubble-agent">您好，已为您查询，订单已于今天下午发出，预计明天送达</div>
          <div class="msg-meta">10:25</div>
        </div>
      </div>

      <div class="msg-row user">
        <div class="msg-avatar user">我</div>
        <div class="msg-content">
          <div class="msg-bubble-user">好的，谢谢</div>
          <div class="msg-meta">10:26</div>
        </div>
      </div>

      <!-- 会话结束系统消息 -->
      <div class="msg-system">— 本次会话已结束 · 如有需要请重新发起咨询 —</div>

      <!-- 客服道别 -->
      <div class="msg-row">
        <div class="msg-avatar agent">王</div>
        <div class="msg-content">
          <div class="msg-bubble-agent">感谢您的咨询，欢迎下次再来～</div>
          <div class="msg-meta">10:26</div>
        </div>
      </div>

      <!-- 会话内评价卡片（核心交互） -->
      <div class="msg-rating-card" id="ratingCard">
        <div class="rc-title">服务评价</div>
        <div class="rc-sub">感谢您的咨询，请对本次服务打分</div>
        <div class="rc-stars">
          <span class="rc-star" data-v="1">★</span>
          <span class="rc-star" data-v="2">★</span>
          <span class="rc-star" data-v="3">★</span>
          <span class="rc-star" data-v="4">★</span>
          <span class="rc-star" data-v="5">★</span>
        </div>
        <div class="rc-tags">
          <span class="rc-tag">响应迅速</span>
          <span class="rc-tag">态度友好</span>
          <span class="rc-tag">专业能力强</span>
          <span class="rc-tag">问题已解决</span>
        </div>
        <button class="rc-submit" disabled>提交评价</button>
        <div class="rc-thanks">感谢您的评价，祝您生活愉快！</div>
      </div>
    </div>

    <!-- ============ 底部操作区（会话已关闭） ============ -->
    <div class="closed-actions">
      <button class="ca-btn secondary" id="btnBack">返回上一页</button>
      <button class="ca-btn primary" id="btnReconsult">重新咨询</button>
    </div>

    <!-- Toast -->
    <div class="cs-toast" id="csToast"></div>

  </div>

  <script>
    // ===== 评价卡片交互（与 user-chat-basic.html 一致） =====
    var rating = 0;
    var ratingCard = document.getElementById('ratingCard');
    var stars = ratingCard.querySelectorAll('.rc-star');
    var tags = ratingCard.querySelectorAll('.rc-tag');
    var submit = ratingCard.querySelector('.rc-submit');
    var chatMessages = document.getElementById('chatMessages');

    stars.forEach(function (star) {
      star.addEventListener('click', function () {
        rating = parseInt(star.getAttribute('data-v'), 10);
        stars.forEach(function (s, i) {
          s.classList.toggle('active', i < rating);
        });
        submit.disabled = (rating === 0);
      });
    });

    tags.forEach(function (tag) {
      tag.addEventListener('click', function () {
        tag.classList.toggle('active');
      });
    });

    submit.addEventListener('click', function () {
      if (rating === 0) return;
      ratingCard.classList.add('done');
      submit.textContent = '已提交';
      submit.disabled = true;
      showToast('评价已提交，感谢您的反馈');
      scrollBottom();
    });

    // 重新咨询按钮
    document.getElementById('btnReconsult').addEventListener('click', function () {
      showToast('正在发起新的咨询...');
      setTimeout(function () {
        location.href = 'user-chat-basic.html';
      }, 600);
    });

    // 返回按钮
    document.getElementById('btnBack').addEventListener('click', function () {
      if (history.length > 1) {
        history.back();
      } else {
        location.href = 'index.html';
      }
    });

    function scrollBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Toast
    var toastTimer = null;
    function showToast(msg) {
      var toast = document.getElementById('csToast');
      toast.textContent = msg;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toast.classList.remove('show');
      }, 2000);
    }

    scrollBottom();
  </script>

</body>
</html>

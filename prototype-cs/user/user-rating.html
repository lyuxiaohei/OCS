<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>服务评价 — CS 商城客服系统</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="mobile.css" />
  <link rel="stylesheet" href="chat.css" />
  <script src="js/cs-common.js"></script>
  <style>
    /* ===== user-rating.html 专属样式 ===== */
    body {
      background: var(--cs-bg-page);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--cs-space-6) 0;
    }
    .page-caption {
      text-align: center;
      margin: 0 0 var(--cs-space-3);
      color: var(--cs-text-tertiary);
      font-size: var(--cs-font-size-sm);
    }
    .page-caption strong { color: var(--cs-text); font-size: var(--cs-font-size-lg); font-weight: var(--cs-font-weight-semibold); }

    /* ============ 消息行（复用） ============ */
    .msg-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      align-items: flex-start;
    }
    .msg-row.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--cs-font-size-md);
      font-weight: var(--cs-font-weight-semibold);
      color: #fff;
    }
    .msg-avatar.agent { background: linear-gradient(135deg, var(--cs-primary), var(--cs-primary-hover)); }
    .msg-avatar.user { background: linear-gradient(135deg, var(--cs-success), var(--cs-success-hover)); }
    .msg-content { max-width: 252px; display: flex; flex-direction: column; }
    .msg-row.user .msg-content { align-items: flex-end; }
    .msg-content .msg-bubble-agent,
    .msg-content .msg-bubble-user { box-shadow: 0 1px 1px rgba(0,0,0,0.04); }
    .msg-system {
      align-self: center;
      background: rgba(0,0,0,0.10);
      color: #fff;
      font-size: var(--cs-font-size-xs);
      padding: 3px 10px;
      border-radius: var(--cs-radius-xs);
      margin: 4px auto;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- ===== 移动端容器 ===== -->
  <div class="cs-phone">

    <script>document.write(CsCommon.statusBar())</script>

    <div class="cs-nav-bar chat-nav">
      <div class="cs-back" title="返回" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </div>
      <div class="nav-peer">
        <div class="peer-info">
          <span class="peer-name">苏银豆客服</span>
        </div>
      </div>
      <div class="nav-actions">
        <div class="nav-action" id="moreHeaderBtn" title="更多">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="5" cy="12" r="1.8"/>
            <circle cx="12" cy="12" r="1.8"/>
            <circle cx="19" cy="12" r="1.8"/>
          </svg>
        </div>
      </div>
      <script>document.write(CsCommon.capsule())</script>
    </div>

    <!-- 消息列表（含结束提示 + 评价卡片） -->
    <div class="chat-messages" id="chatMessages">

      <div class="msg-row">
        <div class="msg-avatar agent">客</div>
        <div class="msg-content">
          <div class="msg-bubble-agent">您好，欢迎联系苏银豆商城客服中心！我是您的专属客服，请问有什么可以帮您？</div>
        </div>
      </div>

      <!-- 会话内评价卡片 -->
      <script>document.write(CsCommon.ratingCard())</script>
    </div>

    <!-- 快捷卡片入口条（公共组件） -->
    <script>document.write(CsCommon.quickCardsBar())</script>
    <!-- 输入区（公共类，对齐 basic，会话已结束态） -->
    <div class="chat-input-area">
      <div class="input-icon" title="语音输入">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 14a3 3 0 003-3V6a3 3 0 00-6 0v5a3 3 0 003 3z" fill="#595959"/>
          <path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="#595959" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <input type="text" id="msgInput" placeholder="会话已结束，感谢您的咨询" disabled />
      <div class="input-icon" id="moreIcon" title="更多">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="#595959" stroke-width="1.8" fill="none"/>
          <path d="M12 8v8M8 12h8" stroke="#595959" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="send-btn" style="width:auto;padding:0 12px;">发送</div>
    </div>
    <script>
      ((function () {
        // 快捷卡片按钮
        var M = { transfer: '转人工', order: '发送订单', refund: '发送售后', logistics: '查看物流', rating: '服务评价' };
        CsCommon.bindQuickCards(function (action) {
          if (window.csModal) csModal.toast('已选择' + (M[action] || '') + '卡片（演示）');
        });
        // 顶栏更多按钮
        var moreBtn = document.getElementById('moreHeaderBtn');
        if (moreBtn) moreBtn.addEventListener('click', function () {
          if (window.csModal) csModal.toast('更多：转人工 · 结束会话 · 投诉建议');
        });
        // 输入区「更多」按钮（+号）：会话已结束
        var moreIcon = document.getElementById('moreIcon');
        if (moreIcon) moreIcon.addEventListener('click', function () {
          if (window.csModal) csModal.toast('会话已结束，如需帮助请重新发起咨询');
        });
      })();
    </script>

  </div>

  <script>
    // 评价卡片交互（与 user-chat-basic/closed 一致）
    var chatMessages = document.getElementById('chatMessages');
    CsCommon.bindRating(chatMessages);

    chatMessages.scrollTop = chatMessages.scrollHeight;
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>离线留言（用户端） — CS 商城客服系统</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="mobile.css" />
  <link rel="stylesheet" href="chat.css" />
  <script src="js/cs-common.js"></script>
  <style>
    /* ===== user-offline.html 专属样式（复用 user-chat-basic 外壳） ===== */
    body {
      background: var(--cs-bg-page);
      min-height: 100vh;
      padding: var(--cs-space-6) 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .cs-phone {
      margin: 0 auto 16px;
      height: 720px;
      --chat-card-width: 252px;
    }
    @media (max-width: 430px) {
      .cs-phone { height: 100vh; }
    }

    .page-head {
      max-width: 480px;
      margin: 0 auto 18px;
      text-align: center;
    }
    .page-head h1 {
      font-size: var(--cs-font-size-lg);
      font-weight: var(--cs-font-weight-semibold);
      color: var(--cs-text);
      margin: 0 0 3px;
    }
    .page-head .back-link {
      font-size: var(--cs-font-size-sm);
      color: var(--cs-text-tertiary);
    }
    .page-head .back-link a { color: var(--cs-primary); }

    /* ---- 会话头（合并进导航栏） ---- */
    .chat-nav .nav-peer {
      position: absolute;
      top: 44px;
      left: 56px;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100% - 200px);
      min-width: 0;
    }
    .chat-nav .peer-info {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
      min-width: 0;
    }
    .chat-nav .peer-name {
      font-size: var(--cs-font-size-lg);
      font-weight: var(--cs-font-weight-semibold);
      color: var(--cs-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chat-nav .peer-status {
      font-size: var(--cs-font-size-xs);
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .chat-nav .peer-status.offline { color: var(--cs-text-tertiary); }
    .chat-nav .peer-status.offline::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--cs-text-tertiary);
      display: inline-block;
    }
    .chat-nav .nav-actions {
      position: absolute;
      top: 44px;
      right: 95px;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .chat-nav .nav-action {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      border-radius: 50%;
      transition: background .15s;
    }
    .chat-nav .nav-action:hover { background: rgba(0,0,0,.06); }
    .chat-nav .nav-action svg { width: 20px; height: 20px; }

    /* ---- Message rows ---- */
    .chat-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px 12px 18px;
      scrollbar-width: none;
      background: #ededed;
    }
    .chat-messages::-webkit-scrollbar { width: 0; height: 0; }

    .msg-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      align-items: flex-start;
    }
    .msg-row.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--cs-font-size-md);
      font-weight: var(--cs-font-weight-semibold);
      color: #fff;
    }
    .msg-avatar.agent {
      background: linear-gradient(135deg, var(--cs-primary), var(--cs-primary-hover));
    }
    .msg-avatar.user {
      background: linear-gradient(135deg, var(--cs-success), var(--cs-success-hover));
    }
    .msg-content {
      max-width: var(--chat-card-width, 252px);
      display: flex;
      flex-direction: column;
    }
    .msg-row.user .msg-content { align-items: flex-end; }
    .msg-content .msg-bubble-user,
    .msg-content .msg-bubble-agent {
      box-shadow: 0 1px 1px rgba(0,0,0,0.04);
    }
    .msg-meta {
      font-size: var(--cs-font-size-xs);
      color: var(--cs-text-placeholder);
      margin: 2px 4px 0;
    }

    /* ---- System divider ---- */
    .msg-system {
      align-self: center;
      background: rgba(0,0,0,0.10);
      color: #fff;
      font-size: var(--cs-font-size-xs);
      padding: 3px 10px;
      border-radius: var(--cs-radius-xs);
      margin: 4px auto;
      text-align: center;
      max-width: 90%;
      line-height: 1.5;
    }

    /* ---- 离线顶部提示条 ---- */
    .offline-notice-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff7e6;
      border: 1px solid #ffe0a3;
      color: #874d00;
      padding: 8px 12px;
      margin: 0 0 10px;
      border-radius: var(--cs-radius-md);
      font-size: var(--cs-font-size-sm);
      line-height: 1.5;
    }
    .offline-notice-bar svg { flex-shrink: 0; }
    .offline-notice-bar .notice-text { flex: 1; }
    .offline-notice-bar .worktime {
      color: var(--cs-text-tertiary);
      font-size: var(--cs-font-size-xs);
      margin-top: 2px;
    }

    /* ---- 快捷问题模板（消息流内嵌） ---- */
    .quick-tpl-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 14px;
      padding: 10px 12px;
      background: #fff;
      border-radius: var(--cs-radius-md);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .quick-tpl-bar .tpl-title {
      width: 100%;
      font-size: var(--cs-font-size-xs);
      color: var(--cs-text-tertiary);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .quick-tpl {
      font-size: var(--cs-font-size-sm);
      padding: 5px 10px;
      border-radius: 14px;
      background: var(--cs-bg-card);
      color: var(--cs-text-secondary);
      border: 1px solid var(--cs-border-light);
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
      user-select: none;
    }
    .quick-tpl:hover {
      background: var(--cs-primary-bg);
      color: var(--cs-primary);
      border-color: var(--cs-border-light);
    }

    /* ---- 场景卡片消息（商品/订单，entry_tag 联动） ----
       根样式(.thread-card / .card-body) 统一继承 styles.css 权威版，
       此处仅保留 offline 场景独有的缩略图/标题/描述/价格规则。 */
    .thread-card .card-thumb {
      width: 100%;
      height: 100px;
      background: linear-gradient(135deg, #ffe7ba, #ffd591);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ad6800;
      font-size: var(--cs-font-size-sm);
    }
    .thread-card .card-title {
      font-size: var(--cs-font-size-sm);
      color: var(--cs-text);
      font-weight: var(--cs-font-weight-medium);
      line-height: 1.4;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .thread-card .card-meta {
      font-size: var(--cs-font-size-xs);
      color: var(--cs-text-tertiary);
      margin-bottom: 4px;
    }
    .thread-card .card-price {
      font-size: var(--cs-font-size-base);
      color: var(--cs-danger);
      font-weight: var(--cs-font-weight-semibold);
    }

    /* ---- 快捷卡片入口条 / 输入区样式统一由 chat.css 提供 ---- */

    /* ---- Input area ---- */
    .chat-input-area {
      height: 54px;
      padding: 0 10px;
      gap: 4px;
    }
    .input-icon {
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      border-radius: var(--cs-radius-sm);
      transition: background .15s;
    }
    .input-icon:hover { background: rgba(0,0,0,.06); }
    .input-icon svg { width: 22px; height: 22px; }
    .input-icon svg path { fill: var(--cs-text-secondary); }
    .chat-input-area input {
      flex: 1;
      height: 34px;
      border-radius: var(--cs-radius-sm);
      border: 1px solid #e0e0e0;
      padding: 0 12px;
      font-size: var(--cs-font-size-md);
      background: #fff;
    }
    .chat-input-area input:focus { border-color: var(--cs-primary); }
    .chat-input-area .send-btn {
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      background: var(--cs-primary);
      color: #fff;
      border-radius: var(--cs-radius-sm);
      cursor: pointer;
      transition: background .15s;
    }
    .chat-input-area .send-btn:hover { background: var(--cs-primary-hover); }
    .chat-input-area .send-btn:disabled {
      background: var(--cs-border);
      cursor: not-allowed;
    }
    .chat-input-area .send-btn svg { width: 18px; height: 18px; }

    .page-footer {
      max-width: 480px;
      margin: 0 auto;
      text-align: center;
      font-size: var(--cs-font-size-sm);
      color: var(--cs-text-tertiary);
    }
    .page-footer a { color: var(--cs-primary); }
  </style>
</head>
<body>

<div class="page-wrap">

  <!-- Page heading -->
  <div class="page-head">
    <h1>离线留言（用户端）</h1>
    <div class="back-link"><a href="javascript:history.back()">&lt; 返回上一页</a> · 移动端 375px · US-MVP-20 / 22</div>
  </div>

  <!-- ===== Mobile chat container ===== -->
  <div class="cs-phone">

    <!-- 小程序状态栏 -->
    <script>document.write(CsCommon.statusBar())</script>

    <!-- 会话导航栏（与其他 user-chat-*.html 一致，状态显示离线） -->
    <div class="cs-nav-bar chat-nav">
      <div class="cs-back" title="返回" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </div>

      <div class="nav-peer">
        <div class="peer-info">
          <span class="peer-name">苏银豆客服</span>
        </div>
      </div>

      <div class="nav-actions">
        <div class="nav-action" id="moreHeaderBtn" title="更多">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="5" cy="12" r="1.8"/>
            <circle cx="12" cy="12" r="1.8"/>
            <circle cx="19" cy="12" r="1.8"/>
          </svg>
        </div>
      </div>

      <script>document.write(CsCommon.capsule())</script>
    </div>

    <!-- Message list -->
    <div class="chat-messages" id="chatMessages">

      <!-- System divider -->
      <div class="msg-system">— 客服当前离线，留言将在客服上线后回复 —</div>

      <!-- Agent welcome text -->
      <div class="msg-row">
        <div class="msg-avatar agent">客</div>
        <div class="msg-content">
          <div class="msg-bubble-agent">当前无客服在线（工作时间 9:00-21:00），您可以留下问题和联系方式，客服上线后将第一时间为您处理。</div>
          <div class="msg-meta">昨天 22:15</div>
        </div>
      </div>

      <!-- FAQ 常见问题卡片（客服推荐，点击问题跳转帮助中心） -->
      <div class="msg-row" id="sceneCardMsg">
        <div class="msg-avatar agent">客</div>
        <div class="msg-content">
          <script>document.write(CsCommon.cardHtml('faq'))</script>
          <div class="msg-meta">09:41</div>
        </div>
      </div>

    </div>

    <!-- 快捷卡片入口条（公共组件） -->
    <script>document.write(CsCommon.quickCardsBar())</script>
    <!-- Input area（对齐 basic：语音 + 输入 + 更多 + 发送） -->
    <div class="chat-input-area">
      <div class="input-icon" title="语音输入">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 14a3 3 0 003-3V6a3 3 0 00-6 0v5a3 3 0 003 3z" fill="#595959"/>
          <path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="#595959" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <input type="text" id="msgInput" placeholder="客服离线，留言即可..." />
      <div class="input-icon" id="moreIcon" title="更多">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="#595959" stroke-width="1.8" fill="none"/>
          <path d="M12 8v8M8 12h8" stroke="#595959" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="send-btn" id="sendBtn" style="width:auto;padding:0 12px;">发送</div>
    </div>
    <script>
      (function () {
        // 快捷卡片按钮
        var M = { transfer: '转人工', order: '发送订单', refund: '发送售后', logistics: '查看物流', rating: '服务评价' };
        CsCommon.bindQuickCards(function (action) {
          if (window.csModal) csModal.toast('已选择' + (M[action] || '') + '卡片（演示）');
        });
        // 输入区「更多」按钮（+号）：弹出快捷留言模板
        var moreIcon = document.getElementById('moreIcon');
        if (moreIcon) moreIcon.addEventListener('click', function () {
          if (window.csModal) csModal.toast('更多：图片 · 快捷留言模板 · 转人工');
        });
      })();
    </script>

  </div>

</div>

<script>
  /* ---------- 场景联动：解析 entry_tag，自动发送卡片消息 ---------- */
  var SCENE_TEMPLATES = {
    product: { label: '商品咨询', title: '无线降噪耳机 H9', meta: '来自商品详情页', price: '¥899' },
    order:   { label: '订单咨询', title: '订单 #20260611042', meta: '来自订单列表', price: '¥1,299' },
    cart:    { label: '购物车咨询', title: '购物车 3 件商品', meta: '来自购物车页面', price: '¥1,599' },
    refund:  { label: '退款咨询', title: '退款申请 #RF20260611', meta: '来自退款详情页', price: '¥299' },
    help:    { label: '帮助中心', title: '帮助中心咨询', meta: '来自帮助中心', price: '' },
    home:    { label: '首页咨询', title: '首页咨询', meta: '来自首页', price: '' },
    profile: { label: '个人中心', title: '账户咨询', meta: '来自个人中心', price: '' }
  };

  function getQueryParams() {
    var params = {};
    var search = window.location.search.substring(1);
    if (!search) return params;
    search.split('&').forEach(function (pair) {
      var idx = pair.indexOf('=');
      if (idx > -1) {
        params[decodeURIComponent(pair.substring(0, idx))] = decodeURIComponent(pair.substring(idx + 1));
      }
    });
    return params;
  }

  function applySceneContext() {
    var params = getQueryParams();
    var tag = params.entry_tag;
    if (!tag || !SCENE_TEMPLATES[tag]) return;

    var tpl = SCENE_TEMPLATES[tag];
    var cardMsg = document.getElementById('sceneCardMsg');

    // 填充卡片内容
    document.getElementById('sceneCardTitle').textContent = tpl.title;
    var metaParts = [tpl.meta];
    if (params.product_id) metaParts.push('商品 #' + params.product_id);
    if (params.order_id) metaParts.push('订单 #' + params.order_id);
    document.getElementById('sceneCardMeta').textContent = metaParts.join(' · ');
    document.getElementById('sceneCardPrice').textContent = tpl.price;
    document.getElementById('sceneCardTime').textContent = currentTime();

    // 显示卡片消息
    cardMsg.style.display = 'flex';
  }

  /* ---------- 快捷问题模板 ---------- */
  var QUICK_TPL_TEXT = {
    refund:    '退款进度咨询：我于近期申请了退款，想了解退款进度及预计到账时间。',
    logistics: '物流状态查询：我的订单物流长时间未更新，请帮忙查询当前物流状态。',
    product:   '商品质量咨询：收到的商品与描述不符/存在质量问题，需要处理。',
    invoice:   '发票开具咨询：需要为本次订单开具发票，请协助处理发票抬头及税号信息。',
    cancel:    '取消订单申请：因个人原因需要取消订单，请协助处理取消及退款事宜。',
    coupon:    '优惠券使用问题：下单时优惠券无法使用/未生效，请帮忙核实。'
  };

  function bindQuickTemplates() {
    var list = document.querySelector('.quick-tpl-bar');
    list.addEventListener('click', function (e) {
      var tpl = e.target.closest('.quick-tpl');
      if (!tpl) return;
      var key = tpl.getAttribute('data-tpl');
      var text = QUICK_TPL_TEXT[key];
      if (text) {
        sendMessage(text);
      }
    });
  }

  /* ---------- 发送消息 ---------- */
  function currentTime() {
    var d = new Date();
    var h = String(d.getHours()).padStart(2, '0');
    var m = String(d.getMinutes()).padStart(2, '0');
    return h + ':' + m;
  }

  function sendMessage(text) {
    text = (text || '').trim();
    if (!text) return;

    var box = document.getElementById('chatMessages');
    var row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML =
      '<div class="msg-avatar user">我</div>' +
      '<div class="msg-content">' +
        '<div class="msg-bubble-user"></div>' +
        '<div class="msg-meta">' + currentTime() + '</div>' +
      '</div>';
    row.querySelector('.msg-bubble-user').textContent = text;
    box.appendChild(row);
    scrollToBottom();

    // 清空输入框
    var input = document.getElementById('msgInput');
    if (input) input.value = '';

    // 插入系统提示（首次留言）
    if (!firstLeaveAck) {
      firstLeaveAck = true;
      setTimeout(function () {
        insertSystemMsg('留言已提交，客服将在上线后回复您（预计 9:00 上线后 30 分钟内）');
      }, 300);
    }
  }

  function insertSystemMsg(text) {
    var box = document.getElementById('chatMessages');
    var sys = document.createElement('div');
    sys.className = 'msg-system';
    sys.textContent = text;
    box.appendChild(sys);
    scrollToBottom();
  }

  function scrollToBottom() {
    var box = document.getElementById('chatMessages');
    box.scrollTop = box.scrollHeight;
  }

  /* ---------- 输入框 + 发送按钮 ---------- */
  function bindInput() {
    var input = document.getElementById('msgInput');
    var sendBtn = document.getElementById('sendBtn');

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage(input.value);
      }
    });

    sendBtn.addEventListener('click', function () {
      sendMessage(input.value);
    });
  }

  /* ---------- 顶栏「更多」按钮 ---------- */
  (function () {
    var btn = document.getElementById('moreHeaderBtn');
    if (btn) {
      btn.addEventListener('click', function () {
        if (window.csModal) csModal.toast('更多：查看留言记录 · 切换联系方式 · 投诉建议');
      });
    }
  })();

  /* ---------- 初始化 ---------- */
  var firstLeaveAck = false;
  window.addEventListener('DOMContentLoaded', function () {
    bindInput();
    scrollToBottom();
  });
</script>

</body>
</html>

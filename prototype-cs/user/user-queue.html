<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>排队等待 — CS 商城客服系统</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="mobile.css" />
  <style>
    /* ===== user-queue.html 专属样式 ===== */
    body {
      background: var(--cs-bg-page);
      padding: var(--cs-space-6) 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-caption {
      text-align: center;
      margin: 0 auto var(--cs-space-3);
      color: var(--cs-text-tertiary);
      font-size: var(--cs-font-size-sm);
    }
    .page-caption strong { color: var(--cs-text); font-size: var(--cs-font-size-lg); font-weight: var(--cs-font-weight-semibold); }

    .hidden { display: none !important; }

    /* ============ 导航栏客服状态 ============ */
    .nav-peer {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .agent-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cs-primary), var(--cs-primary-hover));
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--cs-font-size-sm);
      font-weight: var(--cs-font-weight-semibold);
      flex-shrink: 0;
    }
    .peer-info { display: flex; flex-direction: column; min-width: 0; }
    .peer-name {
      font-size: var(--cs-font-size-md);
      font-weight: var(--cs-font-weight-semibold);
      color: var(--cs-text);
      line-height: 1.2;
    }
    .peer-status {
      font-size: var(--cs-font-size-xs);
      line-height: 1.2;
    }
    .peer-status.busy { color: #fa8c16; }
    .peer-status.online { color: var(--cs-success); }

    /* ============ 排队提示条（核心：一行小条） ============ */
    .queue-banner {
      height: 36px;
      background: #fff7e6;
      border-bottom: 1px solid #ffe7ba;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: var(--cs-font-size-sm);
      color: var(--cs-text-secondary);
      flex-shrink: 0;
      transition: background 0.3s, border-color 0.3s;
    }
    .queue-banner .queue-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #fa8c16;
      animation: blink 1s infinite;
      flex-shrink: 0;
    }
    .queue-banner b { color: #fa8c16; font-weight: var(--cs-font-weight-semibold); }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .queue-banner.connected {
      background: #f6ffed;
      border-bottom-color: #b7eb8f;
      color: var(--cs-success);
    }
    .queue-banner.connected .queue-dot {
      background: var(--cs-success);
      animation: none;
    }
    .queue-banner.connected b { color: var(--cs-success); }

    /* ============ 排队提示（中间一行小字） ============ */
    .queue-tip {
      align-self: center;
      margin: 12px auto;
      padding: 2px 10px;
      font-size: var(--cs-font-size-xs);
      color: var(--cs-text-tertiary);
      text-align: center;
      line-height: 1.6;
    }
    .queue-tip b { color: #fa8c16; font-weight: var(--cs-font-weight-semibold); }
    .queue-tip.connected b { color: var(--cs-success); }

    /* ============ 消息列表（复用 mobile.css .chat-messages） ============ */
    .msg-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      align-items: flex-end;
    }
    .msg-avatar {
      width: 34px; height: 34px;
      border-radius: 6px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--cs-font-size-md);
      font-weight: var(--cs-font-weight-semibold);
      color: #fff;
    }
    .msg-avatar.agent {
      background: linear-gradient(135deg, var(--cs-primary), var(--cs-primary-hover));
    }
    .msg-content {
      max-width: 252px;
      display: flex;
      flex-direction: column;
    }
    .msg-content .msg-bubble-agent {
      box-shadow: 0 1px 1px rgba(0,0,0,0.04);
    }
    .msg-system {
      align-self: center;
      background: rgba(0,0,0,0.10);
      color: #fff;
      font-size: var(--cs-font-size-xs);
      padding: 3px 10px;
      border-radius: var(--cs-radius-xs);
      margin: 4px auto;
      text-align: center;
    }

    /* ============ 底部输入区（排队中禁用） ============ */
    .queue-input-bar {
      height: 56px;
      background: #f7f7f7;
      border-top: 1px solid #dcdcdc;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: var(--cs-space-2);
      flex-shrink: 0;
    }
    .queue-input-bar input {
      flex: 1;
      height: 36px;
      border-radius: 18px;
      border: 1px solid #ddd;
      padding: 0 16px;
      font-size: var(--cs-font-size-md);
      outline: none;
      background: #f0f0f0;
      color: var(--cs-text-placeholder);
    }
    .btn-leave-msg {
      height: 32px;
      padding: 0 14px;
      border: 1px solid var(--cs-border-light);
      background: #fff;
      color: var(--cs-text-secondary);
      font-size: var(--cs-font-size-sm);
      border-radius: 16px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .btn-leave-msg:active { background: #f5f5f5; }
    .queue-input-bar.connected input {
      background: #fff;
      color: var(--cs-text);
      border-color: #e0e0e0;
    }

    /* Toast */
    .cs-toast {
      position: absolute;
      left: 50%;
      bottom: 80px;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 8px 16px;
      border-radius: var(--cs-radius-md);
      font-size: var(--cs-font-size-sm);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
      z-index: 99;
      white-space: nowrap;
    }
    .cs-toast.show { opacity: 1; }
  </style>
</head>
<body>

  <p class="page-caption"><strong>用户端 · 排队等待</strong> &nbsp;|&nbsp;US-MVP-21 排队等待提示</p>

  <!-- ===== 移动端容器 (375px) ===== -->
  <div class="cs-phone">

    <!-- 小程序状态栏 -->
    <div class="cs-status-bar">
      <span class="sb-time">09:41</span>
      <div class="sb-icons">
        <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
      </div>
    </div>

    <!-- 小程序导航栏 -->
    <div class="cs-nav-bar">
      <div class="cs-back" title="返回" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </div>
      <div class="nav-peer">
        <div class="agent-avatar">客</div>
        <div class="peer-info">
          <span class="peer-name">在线客服</span>
          <span class="peer-status busy" id="peerStatus">排队中</span>
        </div>
      </div>
      <div class="cs-capsule" title="微信胶囊">
        <svg viewBox="0 0 2808 1024" xmlns="http://www.w3.org/2000/svg"><path d="M2296.677184 1023.997952h-1784.679086a511.998098 511.998098 0 0 1-362.026541-874.024639A508.633539 508.633539 0 0 1 511.998098 0.001755h1784.679086a511.998098 511.998098 0 0 1 362.026541 874.02464A508.662796 508.662796 0 0 1 2296.677184 1023.997952z m-1784.679086-994.739162a482.741064 482.741064 0 0 0 0 965.482128h1784.679086a482.741064 482.741064 0 1 0 0-965.482128z"/><path d="M614.397718 492.075813a120.890065 117.78882 90 1 0 235.577639 0 120.890065 117.78882 90 1 0-235.577639 0Z"/><path d="M483.531004 508.225696m-78.52588 0a78.52588 78.52588 0 1 0 157.05176 0 78.52588 78.52588 0 1 0-157.05176 0Z"/><path d="M967.822691 495.147802m-65.447986 0a65.447985 65.447985 0 1 0 130.895971 0 65.447985 65.447985 0 1 0-130.895971 0Z"/><path d="M2065.400329 370.512836a145.934087 145.934087 0 0 0-145.758545 145.758545 145.934087 145.934087 0 0 0 145.758545 145.758544 145.934087 145.934087 0 0 0 145.758544-145.758544 145.934087 145.934087 0 0 0-145.758544-145.758545m0-117.028136a262.786681 262.786681 0 1 1 0 525.573362 262.786681 262.786681 0 0 1 0-525.573362z" fill="#000"/><path d="M2070.374024 521.332848m-91.633031 0a91.633031 91.633031 0 1 0 183.266062 0 91.633031 91.633031 0 1 0-183.266062 0Z"/><path d="M1404.337641 204.800995h29.257034v585.140684h-29.257034z"/></svg>
      </div>
    </div>

    <!-- ============ 消息列表 ============ -->
    <div class="chat-messages" id="chatMessages">
      <div class="msg-system">— 您已进入排队队列 —</div>

      <!-- 排队提示（中间一行小字） -->
      <div class="queue-tip" id="queueTip">
        排队中，前面还有 <b id="aheadNumber">3</b> 位用户，预计 <span id="etaTime">02:30</span>
      </div>

      <div class="msg-row">
        <div class="msg-avatar agent">客</div>
        <div class="msg-content">
          <div class="msg-bubble-agent">您好，当前咨询人数较多，已为您进入排队队列。客服上线后将自动为您接通，请耐心等待。</div>
        </div>
      </div>
    </div>

    <!-- ============ 底部输入区（排队中禁用） ============ -->
    <div class="queue-input-bar" id="queueInputBar">
      <input type="text" disabled placeholder="排队中，暂无法发送消息" />
      <button class="btn-leave-msg" onclick="location.href='user-offline.html'">转留言</button>
    </div>

    <!-- Toast -->
    <div class="cs-toast" id="csToast"></div>

  </div>

  <script>
    // ===== 排队状态 =====
    var state = {
      ahead: 3,           // 前面还有几人
      etaSeconds: 150,    // 预计等待秒数
      intervalId: null,   // 排队递减定时器
      etaIntervalId: null // 预计等待倒计时
    };

    var chatMessages = document.getElementById('chatMessages');
    var queueTip = document.getElementById('queueTip');
    var queueInputBar = document.getElementById('queueInputBar');
    var peerStatus = document.getElementById('peerStatus');

    // 初始化
    function init() {
      updateBanner();
      // 每 2 秒前面减少 1 人（模拟前面用户被接通）
      state.intervalId = setInterval(decreaseQueue, 2000);
      // 预计等待时间每秒 -1
      state.etaIntervalId = setInterval(tickEta, 1000);
    }

    // 前面人数递减
    function decreaseQueue() {
      if (state.ahead <= 0) {
        connectAgent();
        return;
      }
      state.ahead--;
      updateBanner();
      // 插入排队进度系统消息
      if (state.ahead > 0) {
        appendSystemMsg('您前面还有 ' + state.ahead + ' 位用户');
      }
      if (state.ahead <= 0) {
        connectAgent();
      }
    }

    // 预计等待时间 -1s
    function tickEta() {
      if (state.etaSeconds > 0) {
        state.etaSeconds--;
      }
      document.getElementById('etaTime').textContent = formatTime(state.etaSeconds);
    }

    // 更新提示条
    function updateBanner() {
      document.getElementById('aheadNumber').textContent = state.ahead;
    }

    // 格式化时间 mm:ss
    function formatTime(sec) {
      var m = Math.floor(sec / 60);
      var s = sec % 60;
      return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }

    // 插入系统消息
    function appendSystemMsg(text) {
      var div = document.createElement('div');
      div.className = 'msg-system';
      div.textContent = text;
      chatMessages.appendChild(div);
      scrollBottom();
    }

    // 插入客服消息
    function appendAgentMsg(text) {
      var row = document.createElement('div');
      row.className = 'msg-row';
      row.innerHTML =
        '<div class="msg-avatar agent">王</div>' +
        '<div class="msg-content">' +
          '<div class="msg-bubble-agent">' + text + '</div>' +
        '</div>';
      chatMessages.appendChild(row);
      scrollBottom();
    }

    // 滚动到底部
    function scrollBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // 接通客服
    function connectAgent() {
      clearInterval(state.intervalId);
      clearInterval(state.etaIntervalId);
      // 提示文字变更为已接通
      queueTip.classList.add('connected');
      queueTip.innerHTML = '客服 <b>王小明</b> 已为您接通';
      // 导航栏状态变在线
      peerStatus.className = 'peer-status online';
      peerStatus.textContent = '在线';
      // 插入接通消息
      appendSystemMsg('— 客服 王小明 已为您服务 —');
      appendAgentMsg('您好，我是客服王小明，很高兴为您服务！请问有什么可以帮您？');
      // 输入区恢复
      queueInputBar.classList.add('connected');
      var input = queueInputBar.querySelector('input');
      input.disabled = false;
      input.placeholder = '请输入消息...';
    }

    // Toast 提示
    var toastTimer = null;
    function showToast(msg) {
      var toast = document.getElementById('csToast');
      toast.textContent = msg;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function() {
        toast.classList.remove('show');
      }, 2000);
    }

    // 启动
    init();
    scrollBottom();
  </script>

</body>
</html>

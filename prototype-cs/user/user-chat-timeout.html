<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>超时提示 — CS 商城客服系统</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="mobile.css" />
  <link rel="stylesheet" href="chat.css" />
  <script src="js/cs-common.js"></script>
  <style>
    /* ===== user-chat-timeout.html 专属样式 ===== */
    /* 场景：用户长时间未回复客服 → 系统提醒 → 仍无回复 → 自动关闭会话
       业务规则对齐 admin-settings.html「会话超时设置」：
         - 用户无响应超时：15 分钟（演示用 30 秒）
         - 自动关闭时长：30 分钟（演示用 60 秒）
         - 超时提醒文案：固定
         - 关闭后：允许「再次咨询」
    */
    body {
      background: var(--cs-bg-page);
      padding: var(--cs-space-6) 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-caption {
      text-align: center;
      margin: 0 auto var(--cs-space-3);
      color: var(--cs-text-tertiary);
      font-size: var(--cs-font-size-sm);
    }
    .page-caption strong { color: var(--cs-text); font-size: var(--cs-font-size-lg); font-weight: var(--cs-font-weight-semibold); }
    .page-caption .demo-note {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 8px;
      background: #fff7e6;
      border: 1px solid #ffe7ba;
      border-radius: var(--cs-radius-xs);
      color: #fa8c16;
      font-size: var(--cs-font-size-xs);
    }

    /* ============ 导航栏 ============ */
    .nav-peer {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .agent-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cs-primary), var(--cs-primary-hover));
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--cs-font-size-sm);
      font-weight: var(--cs-font-weight-semibold);
      flex-shrink: 0;
    }
    .peer-info { display: flex; flex-direction: column; min-width: 0; }
    .peer-name {
      font-size: var(--cs-font-size-md);
      font-weight: var(--cs-font-weight-semibold);
      color: var(--cs-text);
      line-height: 1.2;
    }
    .peer-status {
      font-size: var(--cs-font-size-xs);
      line-height: 1.2;
    }
    .peer-status.online { color: var(--cs-success); }
    .peer-status.closing { color: var(--cs-danger); }

    /* ============ 消息列表 ============ */
    .msg-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      align-items: flex-start;
    }
    .msg-row.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--cs-font-size-md);
      font-weight: var(--cs-font-weight-semibold);
      color: #fff;
    }
    .msg-sender { font-size: 11px; color: var(--cs-text-tertiary); margin: 0 4px 3px; font-weight: 500; }
    .msg-avatar.agent {
      background: linear-gradient(135deg, var(--cs-primary), var(--cs-primary-hover));
    }
    .msg-avatar.user {
      background: linear-gradient(135deg, var(--cs-success), var(--cs-success-hover));
    }
    .msg-content {
      max-width: 252px;
      display: flex;
      flex-direction: column;
    }
    .msg-row.user .msg-content { align-items: flex-end; }
    .msg-content .msg-bubble-agent,
    .msg-content .msg-bubble-user {
      box-shadow: 0 1px 1px rgba(0,0,0,0.04);
    }
    .msg-meta {
      font-size: var(--cs-font-size-xs);
      color: var(--cs-text-placeholder);
      margin: 2px 4px 0;
    }
    .msg-system {
      align-self: center;
      background: rgba(0,0,0,0.10);
      color: #fff;
      font-size: var(--cs-font-size-xs);
      padding: 3px 10px;
      border-radius: var(--cs-radius-xs);
      margin: 4px auto;
      text-align: center;
    }
    /* 超时提醒系统消息（高亮橙色，区别于普通系统消息） */
    .msg-system.timeout-notice {
      background: #fff7e6;
      color: #fa8c16;
      border: 1px solid #ffe7ba;
      max-width: 280px;
      line-height: 1.6;
      padding: 8px 12px;
      border-radius: var(--cs-radius-sm);
    }
    /* 关闭系统消息（灰色） */
    .msg-system.closed-notice {
      background: #f5f5f5;
      color: var(--cs-text-tertiary);
      border: 1px solid #e0e0e0;
    }

    /* ============ 底部输入区 ============ */
    .chat-input-area {
      height: 54px;
      padding: 0 10px;
      gap: 4px;
    }
    .chat-input-area input {
      flex: 1;
      height: 34px;
      border-radius: var(--cs-radius-sm);
      border: 1px solid #e0e0e0;
      padding: 0 12px;
      font-size: var(--cs-font-size-md);
      background: #fff;
      outline: none;
    }
    .chat-input-area input:focus { border-color: var(--cs-primary); }
    /* 会话关闭后：输入框禁用 */
    .chat-input-area.closed input {
      background: #f5f5f5;
      color: var(--cs-text-placeholder);
      cursor: not-allowed;
    }
    .chat-input-area.closed input::placeholder { color: var(--cs-text-placeholder); }

    /* 会话关闭后的「再次咨询」按钮条（替代输入区） */
    .reconsult-bar {
      display: none;
      height: 54px;
      padding: 8px 12px;
      background: #f7f7f7;
      border-top: 1px solid #dcdcdc;
      align-items: center;
      flex-shrink: 0;
    }
    .reconsult-bar.show { display: flex; }
    .reconsult-bar .rc-btn {
      flex: 1;
      height: 38px;
      border-radius: var(--cs-radius-sm);
      background: var(--cs-primary);
      color: #fff;
      border: none;
      font-size: var(--cs-font-size-sm);
      font-weight: var(--cs-font-weight-medium);
      cursor: pointer;
      font-family: inherit;
    }
    .reconsult-bar .rc-btn:hover { background: var(--cs-primary-hover); }

    /* 演示控制条（仅原型用，方便观察流程） */
    .demo-controls {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
      z-index: 50;
    }
    .demo-controls button {
      padding: 4px 10px;
      font-size: var(--cs-font-size-xs);
      background: rgba(238, 10, 36, 0.9);
      color: #fff;
      border: none;
      border-radius: var(--cs-radius-xs);
      cursor: pointer;
      font-family: inherit;
    }
    .demo-controls button:hover { background: var(--cs-primary-hover); }

    /* Toast */
    .cs-toast {
      position: absolute;
      left: 50%;
      bottom: 80px;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 8px 16px;
      border-radius: var(--cs-radius-md);
      font-size: var(--cs-font-size-sm);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
      z-index: 99;
      white-space: nowrap;
    }
    .cs-toast.show { opacity: 1; }
  </style>
</head>
<body>

  <!-- ===== 移动端容器 (375px) ===== -->
  <div class="cs-phone">

    <!-- 演示控制（仅原型） -->
    <div class="demo-controls">
      <button id="btnDemoTimeout">⏩ 触发超时提醒</button>
      <button id="btnDemoClose">⏩ 立即关闭</button>
    </div>

    <!-- 小程序状态栏 -->
    <script>document.write(CsCommon.statusBar())</script>

    <!-- 小程序导航栏 -->
    <div class="cs-nav-bar chat-nav">
      <div class="cs-back" title="返回" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </div>
      <div class="nav-peer">
        <div class="peer-info">
          <span class="peer-name">苏银豆客服</span>
        </div>
      </div>
      <div class="nav-actions">
        <div class="nav-action" id="moreHeaderBtn" title="更多">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="5" cy="12" r="1.8"/>
            <circle cx="12" cy="12" r="1.8"/>
            <circle cx="19" cy="12" r="1.8"/>
          </svg>
        </div>
      </div>
      <script>document.write(CsCommon.capsule())</script>
    </div>

    <!-- ============ 消息列表 ============ -->
    <div class="chat-messages" id="chatMessages">

      <!-- 客服欢迎语（最后一条来自客服的消息，从此开始计时用户无响应） -->
      <div class="msg-row">
        <div class="msg-avatar agent">客</div>
        <div class="msg-content">
          <div class="msg-bubble-agent">您好，欢迎联系苏银豆商城客服中心！我是您的专属客服，请问有什么可以帮您？</div>
          <div class="msg-meta">10:25</div>
        </div>
      </div>

      <!-- （此处用户长时间未回复，触发超时流程） -->
    </div>

    <!-- ============ 快捷卡片入口条（公共组件） + 底部输入区（对齐 basic） ============ -->
    <script>document.write(CsCommon.quickCardsBar())</script>
    <div class="chat-input-area" id="inputArea">
      <div class="input-icon" id="voiceIcon" title="语音">
        <svg viewBox="0 0 24 24" fill="none" style="width:22px;height:22px;"><path d="M12 14a3 3 0 003-3V6a3 3 0 00-6 0v5a3 3 0 003 3z" fill="#595959"/><path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="#595959" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      </div>
      <input type="text" id="msgInput" placeholder="请输入消息..." />
      <div class="input-icon" id="moreIcon" title="更多">
        <svg viewBox="0 0 24 24" fill="none" style="width:22px;height:22px;"><circle cx="12" cy="12" r="10" stroke="#595959" stroke-width="1.8" fill="none"/><path d="M12 8v8M8 12h8" stroke="#595959" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <div class="send-btn" id="sendBtn">发送</div>
    </div>
    <script>(function(){var M={transfer:'转人工',order:'发送订单',refund:'发送售后',logistics:'查看物流',rating:'服务评价'};CsCommon.bindQuickCards(function(action){alert('已选择'+(M[action]||'')+'卡片（演示）');});})();</script>

    <!-- Toast -->
    <div class="cs-toast" id="csToast"></div>

  </div>

  <script>
    // ============================================================
    // 超时状态机（对齐 admin-settings.html 业务规则）
    //   - REMIND_THRESHOLD = 15 分钟（演示 30 秒）：触发超时提醒
    //   - CLOSE_THRESHOLD  = 30 分钟（演示 60 秒）：自动关闭会话
    //   - 提醒文案固定（与后台 textarea 一致）
    //   - 关闭后允许「再次咨询」
    // ============================================================

    // 演示加速：1 秒 = 1 演示分钟
    var REMIND_AT = 30;   // 演示 30 秒 → 实际 15 分钟
    var CLOSE_AT  = 60;   // 演示 60 秒 → 实际 30 分钟
    var REMIND_TEXT = '您已长时间未回复，如需继续咨询请回复任意内容；会话将在 15 分钟后自动关闭。';

    var state = {
      elapsed: 0,                // 客服最后消息后经过的秒数
      reminded: false,           // 是否已发超时提醒
      closed: false,             // 会话是否已关闭
      tickId: null
    };

    var chatMessages = document.getElementById('chatMessages');
    var peerStatus = document.getElementById('peerStatus');
    var inputArea = document.getElementById('inputArea');
    var reconsultBar = document.getElementById('reconsultBar');

    // 计时器：每秒递增
    state.tickId = setInterval(function () {
      if (state.closed) { clearInterval(state.tickId); return; }
      state.elapsed++;

      // 到达提醒阈值
      if (!state.reminded && state.elapsed >= REMIND_AT) {
        triggerRemind();
      }
      // 到达关闭阈值
      else if (state.elapsed >= CLOSE_AT) {
        triggerClose();
      }
    }, 1000);

    function formatTime(sec) {
      var m = Math.floor(sec / 60);
      var s = sec % 60;
      return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }

    // 触发超时提醒（以客服消息气泡形式发送）
    function triggerRemind() {
      state.reminded = true;
      // 以客服身份发送超时提醒
      appendAgentMsg(REMIND_TEXT);
      scrollBottom();
    }

    // 自动关闭会话
    function triggerClose() {
      state.closed = true;
      clearInterval(state.tickId);
      // 以客服身份发送关闭提示
      appendAgentMsg('会话已自动关闭（用户长时间未回复），感谢您的咨询。');
      // 关闭后禁用输入（不置灰）
      var mi = document.getElementById('msgInput');
      if (mi) { mi.disabled = true; mi.placeholder = '会话已关闭'; }
      // 推送服务评价卡片（与 user-chat-closed.html 一致）
      appendRatingCard();
      scrollBottom();
      showToast('会话已自动关闭');
    }

    // 用户回复 → 重置计时（演示交互）
    function onUserReply() {
      if (state.closed) return;
      // 重置：清除已发提醒、重置 elapsed
      state.elapsed = 0;
      if (state.reminded) {
        state.reminded = false;
        appendSystemMsg('— 已收到您的回复，会话继续 —');
      }
    }

    // 插入系统消息
    function appendSystemMsg(text) {
      var div = document.createElement('div');
      div.className = 'msg-system';
      div.textContent = text;
      chatMessages.appendChild(div);
      scrollBottom();
    }

    // 推送服务评价卡片（HTML 与交互由 CsCommon 提供）
    function appendRatingCard() {
      var row = document.createElement('div');
      row.className = 'msg-row';
      row.innerHTML =
        '<div class="msg-avatar agent">客</div>' +
        '<div class="msg-content">' + CsCommon.ratingCard() + '</div>';
      chatMessages.appendChild(row);
      CsCommon.bindRating(row);
    }

    // 插入超时提醒（橙色高亮）
    function appendTimeoutNotice(text) {
      var div = document.createElement('div');
      div.className = 'msg-system timeout-notice';
      div.textContent = text;
      chatMessages.appendChild(div);
      scrollBottom();
    }

    // 插入关闭提醒（灰色）
    function appendClosedNotice(text) {
      var div = document.createElement('div');
      div.className = 'msg-system closed-notice';
      div.textContent = text;
      chatMessages.appendChild(div);
      scrollBottom();
    }

    // 插入用户消息
    function appendUserMsg(text) {
      var row = document.createElement('div');
      row.className = 'msg-row user';
      row.innerHTML =
        '<div class="msg-avatar user">我</div>' +
        '<div class="msg-content">' +
          '<div class="msg-bubble-user">' + text.replace(/</g, '&lt;') + '</div>' +
          '<div class="msg-meta">' + nowTime() + '</div>' +
        '</div>';
      chatMessages.appendChild(row);
      scrollBottom();
    }

    // 插入客服消息（以客服王小明身份发送）
    function appendAgentMsg(text) {
      var row = document.createElement('div');
      row.className = 'msg-row';
      row.innerHTML =
        '<div class="msg-avatar agent">客</div>' +
        '<div class="msg-content">' +
          '<div class="msg-bubble-agent">' + text.replace(/</g, '&lt;') + '</div>' +
          '<div class="msg-meta">' + nowTime() + '</div>' +
        '</div>';
      chatMessages.appendChild(row);
      scrollBottom();
    }

    function nowTime() {
      return new Date().toTimeString().slice(0, 5);
    }

    function scrollBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // ===== 事件绑定 =====

    // 输入框发送
    document.getElementById('msgInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        var val = this.value.trim();
        if (!val || state.closed) return;
        appendUserMsg(val);
        this.value = '';
        onUserReply();  // 用户回复 → 重置超时计时
      }
    });

    // 演示控制：手动触发超时提醒
    document.getElementById('btnDemoTimeout').addEventListener('click', function () {
      if (state.closed) { showToast('会话已关闭'); return; }
      if (state.reminded) { showToast('已发过超时提醒'); return; }
      state.elapsed = REMIND_AT;
      triggerRemind();
    });

    // 演示控制：手动触发关闭
    document.getElementById('btnDemoClose').addEventListener('click', function () {
      if (state.closed) { showToast('会话已关闭'); return; }
      state.elapsed = CLOSE_AT;
      triggerClose();
    });

    // Toast
    var toastTimer = null;
    function showToast(msg) {
      var toast = document.getElementById('csToast');
      toast.textContent = msg;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toast.classList.remove('show');
      }, 2000);
    }

    scrollBottom();
  </script>

<script>
  (function () {
    var AGENT_NAME = '客服 王小明';
    function ensureSender(row) {
      if (row.querySelector('.msg-sender')) return;
      var c = row.querySelector('.msg-content');
      var s = document.createElement('div'); s.className = 'msg-sender'; s.textContent = AGENT_NAME;
      if (c) c.insertBefore(s, c.firstChild);
      else { var av = row.querySelector('.msg-avatar'); if (av) row.insertBefore(s, av.nextSibling); else row.insertBefore(s, row.firstChild); }
    }
    function init() {
      document.querySelectorAll('.msg-row:not(.user)').forEach(ensureSender);
      var box = document.getElementById('chatMessages');
      if (box && window.MutationObserver) new MutationObserver(function (muts) {
        muts.forEach(function (m) { m.addedNodes.forEach(function (n) {
          if (n.nodeType === 1 && n.classList.contains('msg-row') && !n.classList.contains('user')) ensureSender(n);
        }); });
      }).observe(box, { childList: true });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  })();
</script>
</body>
</html>

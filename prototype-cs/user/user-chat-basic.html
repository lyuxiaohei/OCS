<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>基础消息交互 — CS 商城客服系统</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="mobile.css" />
  <link rel="stylesheet" href="chat.css" />
  <script src="js/cs-modal.js"></script>
  <script src="js/cs-common.js"></script>
  <style>
    /* ===== user-chat-basic.html 专属样式（chat 相关已迁移至 chat.css） ===== */
    body {
      background: #ededed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>

  <!-- ===== Mobile chat container ===== -->
  <div class="cs-phone">

    <!-- 小程序状态栏 -->
    <script>document.write(CsCommon.statusBar())</script>

    <!-- 会话导航栏 -->
    <div class="cs-nav-bar chat-nav">
      <div class="cs-back" title="返回" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </div>

      <div class="nav-peer">
        <div class="peer-info">
          <span class="peer-name" id="navPeerName">苏银豆客服</span>
        </div>
      </div>

      <div class="nav-actions">
        <div class="nav-action" id="phoneCallBtn" title="拨打客服电话">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
        </div>

      </div>

      <script>document.write(CsCommon.capsule())</script>
    </div>

    <!-- Message list -->
    <div class="chat-messages" id="chatMessages">

      <!-- 系统分界条 + 机器人欢迎语 + 场景卡片由场景化初始化脚本动态注入 -->
      <!-- 默认机器人客服问候；转人工后追加人工客服欢迎语 -->

    </div>

    <!-- 语音录制浮层 -->
    <div class="voice-recording" id="voiceRecording">
      <div class="vr-main">
        <span class="vr-dot"></span>
        <span id="vrText">松开 发送</span>
      </div>
      <span class="vr-hint" id="vrHint">00:0<span id="vrSec">0</span></span>
    </div>

    <!-- 更多面板：4 个功能项（相册 + 拍照 + 电话客服 + 转人工） -->
    <div class="more-panel" id="morePanel">
      <div class="more-grid">
        <div class="more-item" data-action="album">
          <div class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>
          <div class="mi-label">相册</div>
        </div>
        <div class="more-item" data-action="camera">
          <div class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
          <div class="mi-label">拍照</div>
        </div>
        <div class="more-item" data-action="phone">
          <div class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
          <div class="mi-label">电话客服</div>
        </div>

        <div class="more-item" data-action="transfer">
          <div class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
          <div class="mi-label">转人工</div>
        </div>

      </div>
    </div>

    <!-- 快捷卡片入口条（公共组件，输入框上方，横向滚动） -->
    <script>document.write(CsCommon.quickCardsBar({ id: 'quickCardsBar' }))</script>

    <!-- [原型演示] 模拟客服撤回最近一条客服消息（生产环境由后端推送撤回事件触发） -->
    <div style="padding:4px 12px 0;font-size:11px;">
      <span id="simAgentRecall" style="color:var(--cs-text-tertiary);cursor:pointer;text-decoration:underline;">[演示] 模拟客服撤回最近一条消息</span>
    </div>

    <!-- 输入工具栏 -->
    <div class="chat-input-area">
      <div class="input-icon" id="voiceIcon" title="切换语音">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 14a3 3 0 003-3V6a3 3 0 00-6 0v5a3 3 0 003 3z" fill="#595959"/>
          <path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="#595959" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <input type="text" id="msgInput" placeholder="请输入消息..." />
      <button class="hold-speak-btn" id="holdSpeakBtn">按住 说话</button>
      <div class="input-icon" id="moreIcon" title="更多">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="#595959" stroke-width="1.8" fill="none"/>
          <path d="M12 8v8M8 12h8" stroke="#595959" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="send-btn" id="sendBtn">发送</div>
    </div>

  </div>

<!-- ===== Demo interactions ===== -->
<script>

  // 顶栏「电话」按钮：一键拨打客服热线
  (function () {
    var btn = document.getElementById('phoneCallBtn');
    if (!btn) return;
    btn.addEventListener('click', function () {
      if (window.confirm('是否拨打客服热线 400-888-8888？')) {
        if (window.csModal) csModal.toast('正在拨打 400-888-8888…');
        else alert('正在拨打 400-888-8888…');
      }
    });
  })();

  // 输入框：有内容时显示「发送」按钮，隐藏「+」
  (function () {
    var input = document.getElementById('msgInput');
    var sendBtn = document.getElementById('sendBtn');
    var moreIcon = document.getElementById('moreIcon');
    if (!input || !sendBtn) return;
    input.addEventListener('input', function () {
      var has = input.value.trim().length > 0;
      sendBtn.classList.toggle('show', has);
      moreIcon.style.display = has ? 'none' : '';
    });
    sendBtn.addEventListener('click', function () {
      var val = input.value.trim();
      if (!val) return;
      var thread = document.getElementById('chatMessages');
      var row = document.createElement('div');
      row.className = 'msg-row user';
      row.innerHTML =
        '<div class="msg-avatar user">我</div>' +
        '<div class="msg-content">' +
          '<div class="msg-bubble-user">' + val.replace(/</g, '&lt;') + '</div>' +
          '<div class="msg-meta">' + new Date().toTimeString().slice(0, 5) + '</div>' +
        '</div>';
      thread.appendChild(row);
      thread.scrollTop = thread.scrollHeight;
      input.value = '';
      sendBtn.classList.remove('show');
      moreIcon.style.display = '';
      // 模拟客服自动回复
      setTimeout(function () {
        var reply = document.createElement('div');
        reply.className = 'msg-row';
        reply.innerHTML =
          '<div class="msg-avatar agent">客</div>' +
          '<div class="msg-content">' +
            '<div class="msg-bubble-agent">您好，您的问题已收到，稍后为您处理～</div>' +
            '<div class="msg-meta">' + new Date().toTimeString().slice(0, 5) + '</div>' +
          '</div>';
        thread.appendChild(reply);
        thread.scrollTop = thread.scrollHeight;
      }, 800);
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); sendBtn.click(); }
    });
  })();

  // 「+」按钮：展开/收起更多面板
  (function () {
    var moreIcon = document.getElementById('moreIcon');
    var panel = document.getElementById('morePanel');
    if (!moreIcon || !panel) return;
    moreIcon.addEventListener('click', function () {
      panel.classList.toggle('show');
    });
  })();

  // ============================================================
  // 长按语音原型（微信式）
  // 1. 点语音图标 → 切换 文本输入框 / "按住 说话"按钮
  // 2. 按住"按住 说话" → 开始录音，浮层显示"松开 发送" + 计时
  // 3. 手指上滑 → 切换到"松开 取消"取消态
  // 4. 松开 → 发送语音消息气泡；取消态下松开 → 不发送
  // ============================================================
  (function () {
    var voiceIcon = document.getElementById('voiceIcon');
    var holdBtn = document.getElementById('holdSpeakBtn');
    var msgInput = document.getElementById('msgInput');
    var overlay = document.getElementById('voiceRecording');
    var vrText = document.getElementById('vrText');
    var vrHint = document.getElementById('vrHint');
    var vrSec = document.getElementById('vrSec');
    if (!voiceIcon || !holdBtn || !overlay) return;

    var voiceMode = false;      // 是否语音模式
    var recording = false;      // 是否正在录音
    var canceling = false;      // 是否处于取消态（手指上滑）
    var sec = 0;
    var timer = null;
    var startY = 0;

    // 切换语音/文本模式
    voiceIcon.addEventListener('click', function () {
      voiceMode = !voiceMode;
      holdBtn.classList.toggle('show', voiceMode);
      msgInput.style.display = voiceMode ? 'none' : '';
      if (!voiceMode && recording) stopRecording(true); // 切回文本时取消录音
    });

    // ---- 录音控制 ----
    function startRecording(e) {
      if (!voiceMode || recording) return;
      e.preventDefault();
      recording = true;
      canceling = false;
      sec = 0;
      holdBtn.classList.add('recording');
      holdBtn.classList.remove('canceling');
      holdBtn.textContent = '松开 发送';
      overlay.classList.add('show');
      overlay.classList.remove('canceling');
      vrText.textContent = '松开 发送';
      vrSec.textContent = '0';
      startY = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
      timer = setInterval(function () {
        sec++;
        vrSec.textContent = sec;
        if (sec >= 60) stopRecording(false); // 最多60秒自动发送
      }, 1000);
    }

    function updateMove(e) {
      if (!recording) return;
      var y = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
      var isCancel = (startY - y) > 50; // 上滑超过50px进入取消态
      if (isCancel !== canceling) {
        canceling = isCancel;
        holdBtn.classList.toggle('canceling', canceling);
        holdBtn.classList.toggle('recording', !canceling);
        holdBtn.textContent = canceling ? '松开 取消' : '松开 发送';
        overlay.classList.toggle('canceling', canceling);
        vrText.textContent = canceling ? '松开 取消' : '松开 发送';
      }
    }

    function stopRecording(isCancel) {
      if (!recording) return;
      recording = false;
      clearInterval(timer);
      timer = null;
      holdBtn.classList.remove('recording', 'canceling');
      holdBtn.textContent = '按住 说话';
      overlay.classList.remove('show', 'canceling');
      var duration = sec;
      sec = 0;
      vrSec.textContent = '0';
      if (isCancel || canceling) {
        canceling = false;
        if (window.csModal && csModal.toast) csModal.toast('已取消');
        return;
      }
      canceling = false;
      if (duration < 1) {
        if (window.csModal && csModal.toast) csModal.toast('录音太短');
        return;
      }
      // 发送语音消息气泡
      sendVoiceMessage(duration);
    }

    // 发送语音气泡到会话（微信式：左喇叭+声波条+右时长，按时长变宽）
    function sendVoiceMessage(duration) {
      var box = document.getElementById('chatMessages');
      if (!box) return;
      var row = document.createElement('div');
      row.className = 'msg-row user';
      var durStr = duration + '"';
      // 气泡宽度：1秒=104px（确保内容不溢出），每秒+6px，上限210px
      var width = Math.max(104, Math.min(104 + (duration - 1) * 6, 210));
      // 5 根声波条（模拟波形，更精致）
      var wavesHtml = '<span class="vb-waves">' +
        '<span class="vb-bar"></span>'.repeat(5) + '</span>';
      row.innerHTML =
        '<div class="msg-avatar"></div>' +
        '<div class="msg-content">' +
          '<div class="msg-sender">我</div>' +
          '<div class="msg-bubble-user voice-bubble" data-dur="' + duration + '" style="width:' + width + 'px;">' +
            '<span class="vb-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16 8a5 5 0 0 1 0 8M19.5 5.5a9 9 0 0 1 0 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></span>' +
            wavesHtml +
            '<span class="vb-dur">' + durStr + '</span>' +
          '</div>' +
        '</div>';
      box.appendChild(row);
      box.scrollTop = box.scrollHeight;
      // 点击播放动画
      var bubble = row.querySelector('.voice-bubble');
      bubble.addEventListener('click', function () {
        if (bubble.classList.contains('playing')) return;
        bubble.classList.add('playing');
        setTimeout(function () { bubble.classList.remove('playing'); }, duration * 1000);
      });
      // 演示：1秒后客服回复一条语音
      setTimeout(function () {
        if (window.csChat) {
          // 客服回语音气泡（agent 方向：左时长+右声波+喇叭）
          var agentRow = document.createElement('div');
          agentRow.className = 'msg-row agent';
          var agentWidth = Math.max(104, Math.min(104 + (duration - 1) * 6, 210));
          agentRow.innerHTML =
            '<div class="msg-avatar"></div>' +
            '<div class="msg-content">' +
              '<div class="msg-sender">客服 王小明</div>' +
              '<div class="msg-bubble-agent voice-bubble" data-dur="' + duration + '" style="width:' + agentWidth + 'px;">' +
                '<span class="vb-dur">' + durStr + '</span>' +
                wavesHtml +
                '<span class="vb-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16 8a5 5 0 0 1 0 8M19.5 5.5a9 9 0 0 1 0 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></span>' +
              '</div>' +
            '</div>';
          box.appendChild(agentRow);
          box.scrollTop = box.scrollHeight;
          var agentBubble = agentRow.querySelector('.voice-bubble');
          agentBubble.addEventListener('click', function () {
            if (agentBubble.classList.contains('playing')) return;
            agentBubble.classList.add('playing');
            setTimeout(function () { agentBubble.classList.remove('playing'); }, duration * 1000);
          });
        }
      }, 800);
    }

    // ---- 事件绑定（同时支持 触摸 + 鼠标） ----
    // 触摸事件
    holdBtn.addEventListener('touchstart', startRecording, { passive: false });
    holdBtn.addEventListener('touchmove', updateMove, { passive: false });
    holdBtn.addEventListener('touchend', function () { stopRecording(false); });
    holdBtn.addEventListener('touchcancel', function () { stopRecording(true); });
    // 鼠标事件（PC 浏览器演示用）
    holdBtn.addEventListener('mousedown', startRecording);
    document.addEventListener('mousemove', function (e) { if (recording) updateMove(e); });
    document.addEventListener('mouseup', function () { if (recording) stopRecording(false); });
    // 防止文本选区
    holdBtn.addEventListener('selectstart', function (e) { e.preventDefault(); });
  })();

  // 更多面板：各功能项交互
  // 卡片类操作（order/product/cart/logistics/refund）> 发送真实富媒体卡片到会话
  // 其他操作（相册/相机/文件/电话/转接/结束）> 演示提示
  (function () {
    // 卡片类 action > 卡片类型映射（key 等于卡片类型）
    var CARD_ACTIONS = {
      order: 'order',
      product: 'product',
      logistics: 'logistics',
      refund: 'refund'
    };
    // 卡片发送后，客服的自动回复（演示）
    var CARD_REPLIES = {
      order: '好的，已收到您的订单信息，请问这笔订单有什么问题？',
      product: '好的，您咨询的是这款商品，请问有什么可以帮您？',
      refund: '好的，已收到您的退款信息，我来为您查看进度。',
      camera:    '已打开相机（演示）',
      file:      '已打开文件选择（演示）',
      phone:     '是否拨打客服热线 400-888-8888？',
      transfer:  '已为您转接人工客服（演示）',
      end:       '确认结束本次会话？（演示）'
    };

    var ACTIONS = {
      camera: '已打开相机（演示）',
      file: '已打开文件选择（演示）',
      phone: '是否拨打客服热线 400-888-8888？',
      transfer: '已为您转接人工客服（演示）',
      end: '确认结束本次会话？（演示）'
    };

    // 转人工后：快捷栏显示"结束会话"按钮
    function showEndButton() {
      var bar = document.getElementById('quickCardsBar');
      if (!bar || bar.querySelector('[data-action="end"]')) return;
      var btn = document.createElement('button');
      btn.className = 'quick-card quick-card-end';
      btn.setAttribute('data-action', 'end');
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>结束会话';
      btn.addEventListener('click', function () {
        if (!window.confirm('确认结束本次会话？')) return;
        // 推送关闭提示 + 评价卡片
        if (window.csChat) {
          setTimeout(function () {
            window.csChat.sendText('感谢您的咨询，欢迎下次再来～', 'agent');
            window.csChat.sendRating();
          }, 500);
        }
        if (window.csModal) csModal.toast('会话已结束');
      });
      bar.appendChild(btn);
    }

    // 需要先选择对象的卡片类型（多对象场景）
    var PICKER_TYPES = { order: 'order', product: 'product', refund: 'refund', logistics: 'logistics' };

    // 统一的卡片发送流程
    function sendCardFlow(key) {
      if (key === 'rating') {
        // 服务评价：点击弹窗评价（与会话内评价卡片一模一样，复用 CsCommon.ratingCard）
        if (window.csModal) csModal.open('modals/modal-service-rating.html', { variant: 'sheet', width: 375 });
        return;
      }
      if (!CARD_ACTIONS[key] || !window.csChat) return;
      var cardType = CARD_ACTIONS[key];
      // 需要选择对象的类型 > 先弹选择列表
      if (PICKER_TYPES[key] && window.csModal) {
        window.csModal.open('modals/modal-object-picker.html?type=' + cardType, {
          variant: 'sheet', width: 375,
          onConfirm: function (data) {
            if (data && data.action === 'pickObject') {
              var objData = buildCardData(data);
              window.csChat.sendCard(data.objectType, 'user', objData);
              setTimeout(function () {
                window.csChat.sendText(CARD_REPLIES[data.objectType] || '好的，已收到您的信息。', 'agent');
              }, 600);
            }
          }
        });
      } else {
        // 无需选择（cart/profile）：直接发默认卡片
        window.csChat.sendCard(cardType, 'user');
        setTimeout(function () {
          window.csChat.sendText(CARD_REPLIES[key] || '好的，已收到您的信息。', 'agent');
        }, 600);
      }
    }

    // 根据选中对象构造卡片数据（接收 picker 传回的完整 data 对象）
    function buildCardData(d) {
      var type = d.objectType;
      var id = d.objectId;
      var name = d.objectName;
      var status = d.objectStatus;
      var map = {
        order: { order_id: id, order_status: status || '运输中', amount: '' },
        product: { product_id: id, product_name: name, price: '' },
        refund: {
          aftersale_id: id,
          aftersale_type: d.aType || '退货退款',
          aftersale_status: d.aStatus || status || '待商家审核',
          refund_amount: d.aAmount || '',
          product_name: d.aProduct || name || '',
          reason: '商品质量问题',
          apply_time: '2026-04-08 10:30',
          supplement_remark: d.aRemark || ''
        },
        logistics: { tracking_no: id, carrier: '顺丰速运' }
      };
      return map[type] || {};
    }

    document.querySelectorAll('.more-item').forEach(function (item) {
      item.addEventListener('click', function () {
        var key = item.getAttribute('data-action');

  // ============================================================
  // 转人工逻辑（全局函数，供快捷栏"转人工"和卡片"转人工"按钮调用）
  // scene: 场景标识 'order'|'product'|'logistics'|'aftersale'|'home'（可选）
  // payload: 场景关键数据，转人工后由客服侧看到（可选）
  // ============================================================
  window.transferToHuman = function (scene, payload) {
    if (window.csModal) csModal.toast('正在为您转接人工客服…');
    setTimeout(function () {
      window.csSession = window.csSession || {};
      window.csSession.isHuman = true;
      window.csSession.scene = scene || null;
      window.csSession.payload = payload || null;
      // 顶栏切换为人工客服
      var navAvatar = document.getElementById('navAvatar');
      var navPeerName = document.getElementById('navPeerName');
      if (navAvatar) navAvatar.textContent = '客';
      if (navPeerName) navPeerName.textContent = '苏银豆客服';
      // 插入系统消息 + 人工问候语 + 场景摘要（如有）
      if (window.csChat) {
        var box = document.getElementById('chatMessages');
        var sys = document.createElement('div');
        sys.className = 'msg-system';
        sys.textContent = '人工客服已接入，您现在可以与真人客服沟通';
        box.appendChild(sys);
        box.scrollTop = box.scrollHeight;
        // 人工客服问候语
        window.csChat.sendText('您好，欢迎联系苏银豆商城客服中心！我是您的专属客服，请问有什么可以帮您？', 'agent');
        // 客服跟进消息
        setTimeout(function () {
          window.csChat.sendText('您好，您的问题已收到，稍后为您处理～', 'agent');
        }, 600);
        // 如有场景数据，发送场景摘要卡片（让客服看到用户带着什么场景进来）
        if (scene && scene !== 'home' && payload) {
          setTimeout(function () {
            var sceneLabels = {
              order: '订单咨询', product: '商品咨询',
              logistics: '物流咨询', aftersale: '售后咨询'
            };
            var summary = '【' + (sceneLabels[scene] || '咨询') + '】';
            if (scene === 'order' && payload.order_id) {
              summary += '订单号 ' + payload.order_id + '（' + (payload.order_status || '') + '）';
            } else if (scene === 'product' && payload.product_name) {
              summary += payload.product_name;
            } else if (scene === 'logistics' && payload.tracking_no) {
              summary += payload.carrier + ' ' + payload.tracking_no;
            } else if (scene === 'aftersale' && payload.aftersale_id) {
              summary += payload.aftersale_type + ' ' + payload.aftersale_id + '（' + (payload.aftersale_status || '') + '）';
            }
            window.csChat.sendText(summary, 'agent');
          }, 300);
        }
      }
      // 快捷栏显示"结束会话"
      showEndButton();
      if (window.csModal) csModal.toast('人工客服已接入');
    }, 1500);
  };

  // 全局：留言引导按钮点击

      if (e.target.getAttribute('data-action') === 'leave-message') {

  // ============================================================
  // 卡片点击交互层（方案 D：信息类>半屏预览，操作类>操作菜单）
  // ============================================================
  (function () {
    var box = document.getElementById('chatMessages');
    if (!box || !window.csModal) return;

    // 卡片类型判定
    function detectCardType(card) {
      var types = ['product', 'order', 'logistics', 'refund', 'faq'];
      for (var i = 0; i < types.length; i++) {
        if (card.classList.contains(types[i])) return types[i];
      }
      return null;
    }

    // 从 URL 缓存里取场景参数（供 modal 查询用）
    var sceneParams = CsCommon.parseQuery();

    // 构造 modal URL（带场景透传的 ID 参数）
    function buildUrl(base, idKey, idVal, extra) {
      var qs = [idKey + '=' + encodeURIComponent(idVal)];
      if (extra) {
        for (var k in extra) {
          if (extra.hasOwnProperty(k)) qs.push(k + '=' + encodeURIComponent(extra[k]));
        }
      }
      return base + '?' + qs.join('&');
    }

    // 打开卡片对应的 modal
    function openCardModal(type) {
      var tag = sceneParams.entry_tag || 'home';
      var url = '';
      var onConfirm = handleCardAction;

      switch (type) {
        case 'product':
          url = buildUrl('modals/modal-product-preview.html', 'id',
            sceneParams.product_id || '10086');
          break;
        case 'logistics':
          url = buildUrl('modals/modal-logistics-preview.html', 'id',
            sceneParams.tracking_no || 'SF1234567890');
          break;
        case 'order':
          url = buildUrl('modals/modal-order-actions.html', 'id',
            sceneParams.order_id || 'JS2026040888001');
          break;
        case 'refund':
          url = buildUrl('modals/modal-refund-actions.html', 'id',
            sceneParams.refund_id || 'RF202604080001');
          break;
        default:
          return;
      }

      window.csModal.open(url, { variant: 'sheet', width: 375, onConfirm: onConfirm });
    }

    // 卡片操作回调：根据 action 在会话里插入系统消息 + toast
    function handleCardAction(data) {
      if (!data || !data.action) return;
      var msgs = {
        // 商品
        addCart: '已将「' + (data.productName || '商品') + '」加入购物车',
        viewDetail: '已在新标签页打开商品详情',
        // 物流
        copyTracking: '运单号已复制：' + (data.trackingNo || ''),
        refreshLogistics: '物流信息已刷新，包裹仍在运输中',
        // 账户
        viewProfile: '已在新标签页打开「我的」账户页',
        viewPoints: '已在新标签页打开积分中心',
        viewOrders: '已在新标签页打开订单列表',
        viewReviews: '已在新标签页打开商品评价',
        viewSpecs: '已在新标签页打开商品详情（含规格）',
        // 订单（标★为排期要求、业务页待补功能）
        viewDetail_order: '已在新标签页打开订单详情',
        refund: '已在新标签页打开退款/售后申请页',
        cancel: '订单已取消，关联的退款申请已自动撤销',
        modifyAddress: '修改收货地址请联系苏银豆客服协助处理',
        trackLogistics: '已在新标签页打开物流追踪',
        contact: '已返回会话继续沟通',
        // 退款
        viewProgress: '已在新标签页打开退款进度',
        // 注：supplement/revoke/fillLogistics 已改为弹窗交互，在事件委托阶段拦截，不走 handleCardAction
        // 购物车
        viewCart: '已在新标签页打开购物车',
        checkout: '已在新标签页打开订单确认页',
        askAll: '__PICK_PRODUCT__',
        clearInvalid: '★ 清理失效商品：功能演示，将移除已下架/售罄/无库存商品',
        // FAQ
        viewFaq: '__OPEN_FAQ__',
        contactAgent: '已通知人工客服介入'
      };

      // 订单操作里也有 viewDetail，区分一下
      var key = data.action;
      if (key === 'viewDetail' && data.orderId) key = 'viewDetail_order';

      var text = msgs[key];
      if (!text) return;

      // 购物车"咨询这些商品" > 弹商品选择列表
      if (text === '__PICK_PRODUCT__' && window.csModal) {
        window.csModal.open('modals/modal-object-picker.html?type=product', {
          variant: 'sheet', width: 375,
          onConfirm: function (data) {
            if (data && data.action === 'pickObject') {
              window.csChat.sendCard('product', 'user', { product_id: data.objectId, product_name: data.objectName, price: '' });
              setTimeout(function () {
                window.csChat.sendText('好的，您咨询的是「' + data.objectName + '」，请问有什么问题？', 'agent');
              }, 600);
            }
          }
        });
        return;
      }
      // FAQ 相关问题 > 重新打开 FAQ modal（不插消息）
      if (text === '__OPEN_FAQ__') {
        var faqUrl = buildUrl('modals/modal-faq-answer.html', 'q', data.faqKey);
        setTimeout(function () {
          window.csModal.open(faqUrl, { variant: 'sheet', width: 375, onConfirm: handleCardAction });
        }, 320); // 等当前弹层完全关闭后再开
        return;
      }

      // 跨项目真跳转映射：action > mini-program 业务页
      // 本页位于 OCS/prototype-cs/user/，需回退两级到「在线客服1」根目录
      var REDIRECTS = {
        // 商品详情：跳转到 mini-program 商品页
        viewDetail: function (d) {
          return '../../mini-program/pages/product_detail.html' +
            (d.productId ? '?id=' + encodeURIComponent(d.productId) : '');
        },
        // 订单详情：跳转到 mini-program 订单详情页
        viewDetail_order: function (d) {
          return '../../mini-program/pages/order_detail.html' +
            (d.orderId ? '?id=' + encodeURIComponent(d.orderId) : '');
        },
        // 订单查看物流：跳转到 mini-program 物流追踪页
        trackLogistics: function (d) {
          return '../../mini-program/pages/logistics.html';
        },
        // 退款进度：跳转到 mini-program 退款详情页
        viewProgress: function (d) {
          var caseMap = { '审核通过，待填写物流': 'refund_return_approved', '商家审核中': 'refund_only_reviewing', '申请已拒绝': 'refund_return_rejected' };
          var c = caseMap[d.refundStatus] || 'refund_return_approved';
          return '../../mini-program/pages/refund_detail.html?case=' + c;
        },
        // 注：supplement/fillLogistics/revoke 已改为弹窗交互，不再跳转
        // 购物车：跳转到 mini-program 购物车页
        viewCart: function (d) {
          return '../../mini-program/pages/cart.html';

        // 购物车-去结算：跳转到订单确认页
        checkout: function (d) {
          return '../../mini-program/pages/order_product.html';
        },
        // 账户：跳转到 mini-program 个人中心页
        viewProfile: function (d) {

        // 积分中心（账户苏银豆）
        viewPoints: function (d) {
          return '../../mini-program/pages/points_center.html';
        },
        // 订单列表（账户订单数）
        viewOrders: function (d) {
          return '../../mini-program/pages/order_list.html';
        },
        // 商品评价列表
        viewReviews: function (d) {
          return '../../mini-program/pages/product_reviews.html';
        },
        // 规格选择（原型无独立页，跳商品详情页）
        viewSpecs: function (d) {
          return '../../mini-program/pages/product_detail.html' +
            (d.productId ? '?id=' + encodeURIComponent(d.productId) : '');
        },
        // 订单-申请退换货 > 退款/售后申请页
        refund: function (d) {
          return '../../mini-program/pages/refund.html';

        // 订单-取消订单
        cancel: function (d) {

      if (REDIRECTS[key]) {
        var targetUrl = REDIRECTS[key](data);
        try {
          window.open(targetUrl, '_blank');

          // 浏览器拦截时，文案提示手动打开
          text = '浏览器拦截了新窗口，请允许弹窗后重试，或手动打开商品详情页';

      // 插入系统消息
      insertSystemMsg(text);
      // toast
      if (window.csModal && window.csModal.toast) window.csModal.toast(text);
    }

    function insertSystemMsg(text) {
      var el = document.createElement('div');
      el.className = 'msg-system';
      el.textContent = text;
      box.appendChild(el);
      box.scrollTop = box.scrollHeight;
    }

    // ===== 事件委托：点击 card-action / faq-item =====
    // 卡片内联按钮点击 > 直接执行操作（不弹 modal）
    box.addEventListener('click', function (e) {
      var btn = e.target.closest('.card-action-btn');
      if (btn) {
        e.stopPropagation();
        if (btn.classList.contains('done')) return; // 已操作的按钮不重复触发
        var action = btn.getAttribute('data-cs-action');
        var data = { action: action };
        var orderId = btn.getAttribute('data-order-id');
        var refundId = btn.getAttribute('data-refund-id');
        if (orderId) data.orderId = orderId;
        if (refundId) data.refundId = refundId;

        // ===== 走弹窗交互的售后操作（supplement/revoke/fillLogistics）=====
        if (action === 'supplement' || action === 'revoke' || action === 'fillLogistics') {
          handleRefundModalAction(btn, action);
          return;
        }

        // 需确认的操作
        if (action === 'cancel') {
          if (!window.confirm('确认取消该订单？取消后关联的退款申请将自动撤销')) return;
          // 联动：取消订单 > 自动撤销关联退款
          var card = btn.closest('.thread-card');
          if (card) {
            var refundBtn = card.querySelector('[data-cs-action="refund"]');
            if (refundBtn) refundBtn.classList.add('done');
          }
        }

        handleCardAction(data);
        // 按钮标记为已操作（防止重复）
        btn.classList.add('done');
        return;
      }
    });

    // ===== 售后操作弹窗（补充说明/撤销/填写物流）=====
    // 从按钮 data 属性读取退款单信息，打开对应弹窗
    function handleRefundModalAction(btn, action) {
      var rid = btn.getAttribute('data-refund-id') || '';
      var rtype = btn.getAttribute('data-refund-type') || '退货退款';
      var rstatus = btn.getAttribute('data-refund-status') || '';
      var ramount = btn.getAttribute('data-refund-amount') || '';
      var remark = btn.getAttribute('data-supplement-remark') || '';

      if (!window.csModal) return;
      var base = 'modals/modal-refund-';
      var url = '', onConfirm;

      if (action === 'supplement') {
        url = base + 'supplement.html?id=' + encodeURIComponent(rid) +
          '&amount=' + encodeURIComponent(ramount) +
          '&status=' + encodeURIComponent(rstatus) +
          '&remark=' + encodeURIComponent(remark);
        onConfirm = function (d) {
          // 保存补充说明：把新备注写回按钮 data 属性，供下次打开时回填
          if (d && d.remark != null) {
            btn.setAttribute('data-supplement-remark', d.remark);
          }
          insertSystemMsg('补充说明已保存');
        };
      } else if (action === 'revoke') {
        url = base + 'revoke.html?id=' + encodeURIComponent(rid) +
          '&amount=' + encodeURIComponent(ramount) +
          '&status=' + encodeURIComponent(rstatus) +
          '&type=' + encodeURIComponent(rtype);
        onConfirm = function (d) {
          // 撤销成功：按钮置灰，卡片状态不变（演示）
          btn.classList.add('done');
          // 同卡片内"补充说明"按钮也置灰（撤销后不可再补充）
          var card = btn.closest('.thread-card');
          if (card) {
            var suppBtn = card.querySelector('[data-cs-action="supplement"]');
            if (suppBtn) suppBtn.classList.add('done');
          }
          insertSystemMsg('退款申请已撤销');
        };
      } else if (action === 'fillLogistics') {
        url = base + 'logistics.html?id=' + encodeURIComponent(rid) +
          '&amount=' + encodeURIComponent(ramount) +
          '&status=' + encodeURIComponent(rstatus);
        onConfirm = function (d) {
          // 物流提交成功：按钮置灰并改文案，状态推进
          btn.classList.add('done');
          btn.textContent = '已填写物流';
          insertSystemMsg('物流信息已提交，等待商家收货');
        };
      }

      window.csModal.open(url, { variant: 'sheet', width: 375, onConfirm: onConfirm });
    }

    box.addEventListener('click', function (e) {
      var action = e.target.closest('.card-action');
      var card = e.target.closest('.thread-card');
      if (action && card) {
        var type = detectCardType(card);
        if (type) {
          e.preventDefault();
          openCardModal(type);
        }
        return;
      }
      // 注：FAQ 卡片内问题项的点击由 CsCommon.bindFaqItemClicks 处理（用户气泡+客服答案，无弹窗）
    });
  })();
</script>

<script>
  // 给所有客服(agent)消息补发送者名称；监听新消息，动态生成的也补
  (function () {
    var AGENT_NAME = '客服 王小明';
    function init() {
      var box = document.getElementById('chatMessages');
      document.querySelectorAll('.msg-row:not(.user)').forEach(function (row) {
        CsCommon.ensureSender(row, AGENT_NAME);
      });
      if (box && window.MutationObserver) {
        new MutationObserver(function (muts) {
          muts.forEach(function (m) { m.addedNodes.forEach(function (n) {
            if (n.nodeType === 1 && n.classList.contains('msg-row') && !n.classList.contains('user')) CsCommon.ensureSender(n, AGENT_NAME);
          }); });
        }).observe(box, { childList: true });
      }
      // 用户消息撤回（长按/右键，2 分钟内）
      if (box && CsCommon.bindRecall) CsCommon.bindRecall(box);

      // [原型演示] 模拟客服撤回最近一条客服消息
      // 生产环境：客服端点撤回 → 后端推送 recall 事件 → 用户端收到后调用 CsCommon.renderAgentRecalled(row)
      var simBtn = document.getElementById('simAgentRecall');
      if (simBtn) simBtn.addEventListener('click', function () {
        var box2 = document.getElementById('chatMessages');
        if (!box2) return;
        // 找最后一条未被撤回的客服消息行
        var agentRows = box2.querySelectorAll('.msg-row:not(.user)');
        var target = null;
        for (var i = agentRows.length - 1; i >= 0; i--) {
          if (!agentRows[i].classList.contains('is-recalled')) { target = agentRows[i]; break; }
        }
        if (!target) { if (window.csModal) csModal.toast('没有可撤回的客服消息'); return; }
        CsCommon.renderAgentRecalled(target);
      });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  })();
</script>
</body>

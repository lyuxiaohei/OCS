<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>选择对象 · 半屏</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../mobile.css" />
  <style>
    html, body { background: #fff; margin: 0; padding: 0; }
    .pk-modal {
      width: 100%;
      background: #fff;
      border-radius: 20px 20px 0 0;
    }
    .pk-handle { width: 32px; height: 4px; background: rgba(0,0,0,0.12); border-radius: 2px; margin: 8px auto 0; }
    .pk-head {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #f0f0f0;
      flex-shrink: 0;
    }
    .pk-title { font-size: 15px; font-weight: 600; color: var(--cs-text); margin: 0 0 2px; }
    .pk-sub { font-size: 12px; color: var(--cs-text-tertiary); }
    .pk-body {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      max-height: 360px;
      padding: 4px 0;
    }
    .pk-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      font-family: inherit;
      transition: background .15s;
      text-align: left;
    }
    .pk-item:hover { background: var(--cs-bg-header); }
    .pk-item:active { background: #f0f0f0; }
    .pk-thumb {
      width: 44px; height: 44px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
    }
    .pk-info { flex: 1; min-width: 0; }
    .pk-name {
      font-size: 13px;
      color: var(--cs-text);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .pk-meta {
      font-size: 11px;
      color: var(--cs-text-tertiary);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .pk-meta .pk-id { font-family: "SFMono-Regular", Consolas, monospace; }
    .pk-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .pk-badge.s-warn { background: #fff7e6; color: #fa8c16; }
    .pk-badge.s-done { background: #f6ffed; color: #52c41a; }
    .pk-badge.s-danger { background: #fff1f0; color: #f5222d; }
    .pk-arrow { color: var(--cs-text-placeholder); font-size: 16px; flex-shrink: 0; }
    .pk-empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--cs-text-tertiary);
      font-size: 13px;
    }
    .pk-cancel {
      width: calc(100% - 32px);
      margin: 4px 16px 14px;
      height: 40px;
      border-radius: 20px;
      border: 1px solid var(--cs-border, #d9d9d9);
      background: #fff;
      color: var(--cs-text-secondary);
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
    }
    .pk-cancel:active { background: var(--cs-bg-header); }
  </style>
</head>
<body>
  <div class="pk-modal">
    <div class="pk-handle"></div>
    <div class="pk-head">
      <h3 class="pk-title" id="pkTitle">选择订单</h3>
      <div class="pk-sub" id="pkSub">请选择要发送的订单</div>
    </div>
    <div class="pk-body" id="pkBody"><!-- JS 渲染 --></div>
    <button class="pk-cancel" id="btnCancel">取消</button>
  </div>

  <script src="../js/cs-modal.js"></script>
  <script>
    (function () {
      // ===== mock 对象库（用户主动发送卡片时选择） =====
      var OBJECTS = {
        order: {
          title: '选择订单', sub: '请选择要咨询的订单',
          thumbColor: 'linear-gradient(135deg, var(--cs-primary), var(--cs-primary-hover))',
          list: [
            { id: 'JS2026040888001', name: '日本进口保温杯 + 纯棉T恤', meta: '¥196.90 · 下单 04-08', badge: '运输中', badgeType: 's-warn' },
            { id: 'JS202604110002', name: '无线蓝牙降噪耳机', meta: '¥89.00 · 下单 04-11', badge: '待发货', badgeType: 's-warn' },
            { id: 'JS2026031011006', name: '潮流太阳眼镜', meta: '¥128.00 · 下单 03-10', badge: '售后中', badgeType: 's-danger' },
            { id: 'JS2026022000033', name: '智能运动手环', meta: '¥199.00 · 下单 02-20', badge: '已签收', badgeType: 's-done' },
            { id: 'JS2026011500078', name: '便携式迷你充电宝', meta: '¥59.00 · 下单 01-15', badge: '已完成', badgeType: 's-done' },
            { id: 'JS2026010100099', name: '运动水壶', meta: '¥39.00 · 下单 01-01', badge: '已取消', badgeType: 's-danger' }
          ]
        },
        product: {
          title: '选择商品', sub: '请选择要咨询的商品',
          thumbColor: 'linear-gradient(135deg, #ff6034, #ee0a24)',
          list: [
            { id: '10086', name: '日本进口保温杯 500ml', meta: '¥68 · 已售 2.3万', badge: '在售', badgeType: 's-done' },
            { id: '10087', name: '无线蓝牙降噪耳机', meta: '¥89 · 已售 5800+', badge: '在售', badgeType: 's-done' },
            { id: '10088', name: '纯棉短袖T恤 L码', meta: '¥39 · 已售 1.2万', badge: '在售', badgeType: 's-done' },
            { id: '10089', name: '便携式迷你充电宝 20000mAh', meta: '¥59 · 已售 8000+', badge: '已下架', badgeType: 's-danger' }
          ]
        },
        refund: {
          title: '选择退款单', sub: '请选择要咨询的退款申请',
          thumbColor: 'linear-gradient(135deg, #fa8c16, #ffa726)',
          // badge 必须用卡片能识别的完整状态文案（与 cs-common.js aftersaleStatusMap key 对齐）
          // aType: 售后类型（仅退款/退货退款/换货）；aStatus: 完整状态文案
          list: [
            { id: 'AS20260408001', name: '保温杯 · 仅退款', meta: '¥25.00 · 申请 04-08', badge: '待商家审核', badgeType: 's-warn', aType: '仅退款', aStatus: '待商家审核', aAmount: '25.00', aProduct: '日本进口保温杯', aRemark: '商品有划痕' },
            { id: 'AS20260408011', name: '降噪耳机 · 退货退款', meta: '¥899.00 · 申请 04-07', badge: '待寄回商品', badgeType: 's-warn', aType: '退货退款', aStatus: '待寄回商品', aAmount: '899.00', aProduct: '无线降噪耳机 H9', aRemark: '' },
            { id: 'AS20260408002', name: '保温杯 · 退货退款', meta: '¥68.00 · 申请 04-08', badge: '待商家审核', badgeType: 's-warn', aType: '退货退款', aStatus: '待商家审核', aAmount: '68.00', aProduct: '日本进口保温杯', aRemark: '' },
            { id: 'AS20260408012', name: '运动跑鞋 · 换货', meta: '¥0.00 · 申请 04-06', badge: '待商家审核', badgeType: 's-warn', aType: '换货', aStatus: '待商家审核', aAmount: '', aProduct: '运动跑鞋（黑色 42 码）', aRemark: '' },
            { id: 'RF202602280004', name: 'T恤退货退款', meta: '¥39.90 · 申请 02-28', badge: '已完成', badgeType: 's-done', aType: '退货退款', aStatus: '完成', aAmount: '39.90', aProduct: '纯棉短袖T恤', aRemark: '' },
            { id: 'RF202603150003', name: '眼镜退货退款', meta: '¥128.00 · 申请 03-15', badge: '申请已拒绝', badgeType: 's-danger', aType: '退货退款', aStatus: '申请已拒绝', aAmount: '128.00', aProduct: '精致蛋糕礼盒', aRemark: '' }
          ]
        },
        logistics: {
          title: '选择物流', sub: '请选择要查询的包裹',
          thumbColor: 'linear-gradient(135deg, #52c41a, #73d13d)',
          list: [
            { id: 'SF1234567890', name: '顺丰速运 · 保温杯+T恤', meta: '运单 SF1234567890', badge: '运输中', badgeType: 's-warn' },
            { id: 'ZT2026040700001', name: '中通快递 · 蓝牙耳机', meta: '运单 ZT2026040700001', badge: '已签收', badgeType: 's-done' },
            { id: 'YT2026031000042', name: '圆通速递 · 太阳眼镜', meta: '运单 YT2026031000042', badge: '已签收', badgeType: 's-done' }
          ]
        }
      };

      var qs = new URLSearchParams(location.search);
      var type = qs.get('type') || 'order';
      var conf = OBJECTS[type] || OBJECTS.order;

      document.getElementById('pkTitle').textContent = conf.title;
      document.getElementById('pkSub').textContent = conf.sub;

      function esc(s) { return String(s).replace(/</g, '&lt;'); }

      var body = document.getElementById('pkBody');
      if (!conf.list.length) {
        body.innerHTML = '<div class="pk-empty">暂无' + esc(conf.title.replace('选择', '')) + '记录</div>';
      } else {
        var html = '';
        conf.list.forEach(function (item) {
          html += '<button class="pk-item" data-id="' + esc(item.id) + '" data-name="' + esc(item.name) + '" data-status="' + esc(item.badge) + '"';
          // 售后单透传完整卡片数据（aType/aStatus/aAmount/aProduct/aRemark）
          if (item.aType) html += ' data-a-type="' + esc(item.aType) + '"';
          if (item.aStatus) html += ' data-a-status="' + esc(item.aStatus) + '"';
          if (item.aAmount != null) html += ' data-a-amount="' + esc(item.aAmount) + '"';
          if (item.aProduct) html += ' data-a-product="' + esc(item.aProduct) + '"';
          if (item.aRemark != null) html += ' data-a-remark="' + esc(item.aRemark) + '"';
          html += '>';
          html +=   '<div class="pk-thumb" style="background:' + conf.thumbColor + ';">' + esc(item.name.charAt(0)) + '</div>';
          html +=   '<div class="pk-info">';
          html +=     '<div class="pk-name">' + esc(item.name) + '</div>';
          html +=     '<div class="pk-meta"><span class="pk-id">' + esc(item.meta) + '</span></div>';
          html +=   '</div>';
          html +=   '<span class="pk-badge ' + (item.badgeType || 's-warn') + '">' + esc(item.badge) + '</span>';
          html +=   '<span class="pk-arrow">›</span>';
          html += '</button>';
        });
        body.innerHTML = html;
      }

      body.addEventListener('click', function (e) {
        var item = e.target.closest('.pk-item');
        if (!item) return;
        // 回传选中的对象信息（父页据此发送对应卡片）
        var payload = {
          action: 'pickObject',
          objectType: type,
          objectId: item.getAttribute('data-id'),
          objectName: item.getAttribute('data-name'),
          objectStatus: item.getAttribute('data-status') || ''
        };
        // 售后单：透传完整卡片数据
        var aType = item.getAttribute('data-a-type');
        if (aType) {
          payload.aType = aType;
          payload.aStatus = item.getAttribute('data-a-status') || '';
          payload.aAmount = item.getAttribute('data-a-amount') || '';
          payload.aProduct = item.getAttribute('data-a-product') || '';
          payload.aRemark = item.getAttribute('data-a-remark') || '';
        }
        window.csModalBridge.confirm(payload);
      });

      document.getElementById('btnCancel').addEventListener('click', function () {
        window.csModalBridge.close();
      });

      // 主动上报高度
      if (window.csModalBridge && window.csModalBridge.reportHeight) {
        requestAnimationFrame(function () {
          try { window.csModalBridge.reportHeight(document.documentElement.offsetHeight); } catch (e) {}
        });
      }
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>退款操作 · 操作菜单</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../mobile.css" />
  <style>
    html, body { background: #fff; margin: 0; padding: 0; }
    .ac-modal {
      width: 100%;
      background: var(--cs-bg-card);
      border-radius: 20px 20px 0 0;
    }
    .ac-handle { width: 32px; height: 4px; background: rgba(0,0,0,0.12); border-radius: 2px; margin: 8px auto 0; flex-shrink: 0; }
    .ac-head {
      padding: 12px 16px 10px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--cs-border-lighter);
    }
    .ac-head .ac-title {
      font-size: 13px;
      color: var(--cs-text-tertiary);
      text-align: center;
      margin: 0 0 4px;
    }
    .ac-head .ac-refund-brief {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      background: var(--cs-bg-header);
      border-radius: 8px;
    }
    .ac-head .ac-refund-id {
      font-size: 12px;
      color: var(--cs-text-secondary);
      font-family: "SFMono-Regular", Consolas, monospace;
    }
    .ac-head .ac-refund-amount {
      font-size: 13px;
      color: var(--cs-primary);
      font-weight: 600;
    }
    .ac-head .ac-refund-status {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .ac-head .ac-refund-status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
    .ac-head .ac-refund-status.s-warn { background: #fff7e6; color: var(--cs-orange); }
    .ac-head .ac-refund-status.s-warn::before { background: var(--cs-orange); }
    .ac-head .ac-refund-status.s-done { background: var(--cs-success-bg); color: var(--cs-success); }
    .ac-head .ac-refund-status.s-done::before { background: var(--cs-success); }
    .ac-head .ac-refund-status.s-danger { background: #fff1f0; color: var(--cs-danger); }
    .ac-head .ac-refund-status.s-danger::before { background: var(--cs-danger); }

    .ac-body {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      max-height: 440px;
      -webkit-overflow-scrolling: touch;
      
      padding: 8px 0;
      
    }
    .ac-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      font-family: inherit;
      transition: background .15s;
    }
    .ac-item:hover { background: var(--cs-bg-header); }
    .ac-item:active { background: var(--cs-border-lighter); }
    .ac-item .ai-icon {
      width: 36px; height: 36px;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .ac-item .ai-icon svg { width: 18px; height: 18px; }
    .ac-item .ai-text { flex: 1; text-align: left; }
    .ac-item .ai-label { font-size: 14px; color: var(--cs-text); font-weight: 500; }
    .ac-item .ai-desc { font-size: 11px; color: var(--cs-text-tertiary); margin-top: 2px; }
    .ac-item .ai-arrow { color: var(--cs-text-placeholder); font-size: 16px; }
    .ac-item .ai-icon.ic-blue   { background: var(--cs-primary-bg); color: var(--cs-primary); }
    .ac-item .ai-icon.ic-orange { background: #fff7e6; color: #fa8c16; }
    .ac-item .ai-icon.ic-red    { background: #fff1f0; color: #f5222d; }
    .ac-item .ai-icon.ic-green  { background: #f6ffed; color: #52c41a; }
    .ac-item .ai-icon.ic-gray   { background: var(--cs-bg-header); color: var(--cs-text-secondary); }

    .ac-cancel {
      width: calc(100% - 32px);
      margin: 4px 16px 14px;
      height: 40px;
      border-radius: 20px;
      border: 1px solid var(--cs-border);
      background: var(--cs-bg-card);
      color: var(--cs-text-secondary);
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      flex-shrink: 0;
    }
    .ac-cancel:active { background: var(--cs-bg-header); }
  </style>
</head>
<body>
  <div class="ac-modal">
    <div class="ac-handle"></div>
    <div class="ac-head">
      <p class="ac-title">退款操作</p>
      <div class="ac-refund-brief">
        <div>
          <div class="ac-refund-id" id="refundId">退款单 #—</div>
          <div class="ac-refund-amount" id="refundAmount">¥ —</div>
        </div>
        <span class="ac-refund-status s-warn" id="refundStatus">—</span>
      </div>
    </div>

    <div class="ac-body" id="acBody">
      <!-- 由 JS 渲染 -->
    </div>

    <button class="ac-cancel" id="btnCancel">取消</button>
  </div>

  <script src="../js/cs-modal.js"></script>
  <script>
    (function () {
      // 数据源：refund_detail.html 的真实 refundNo（RF 前缀）+ amountValue
      var REFUNDS = {
        'RF202604080001': { amount: '¥ 68.00', status: '审核通过，待填写物流', statusType: 's-warn', canCancel: false, canSupplement: false },
        'RF202604110002': { amount: '¥ 89.00', status: '商家审核中', statusType: 's-warn', canCancel: true, canSupplement: true },
        'RF202603150003': { amount: '¥ 128.00', status: '申请已拒绝', statusType: 's-danger', canCancel: false, canSupplement: true }
      };
      var DEFAULT = REFUNDS['RF202604080001'];

      var qs = new URLSearchParams(location.search);
      var rid = qs.get('id') || qs.get('refund_id') || 'RF202604080001';
      var r = REFUNDS[rid] || DEFAULT;

      document.getElementById('refundId').textContent = '退款单 #' + rid;
      document.getElementById('refundAmount').textContent = r.amount;
      var stEl = document.getElementById('refundStatus');
      stEl.textContent = r.status;
      stEl.className = 'ac-refund-status ' + r.statusType;

      // 根据状态过滤可选项
      var ACTIONS = [
        {
          key: 'viewProgress',
          iconCls: 'ic-blue',
          svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
          label: '查看退款进度',
          desc: '完整处理时间线与当前节点',
          always: true
        },
        {
          key: 'supplement',
          iconCls: 'ic-orange',
          svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
          label: '补充说明',
          desc: '上传凭证或补充问题描述',
          always: false,
          condition: r.canSupplement
        },
        {
          key: 'fillLogistics',
          iconCls: 'ic-green',
          svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>',
          label: '填写退货物流',
          desc: '填写退货快递公司和单号',
          always: true
        },
        {
          key: 'revoke',
          iconCls: 'ic-red',
          svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>',
          label: '撤销退款申请',
          desc: '撤销后无法恢复，需重新申请',
          always: false,
          condition: r.canCancel
        },
        {
          key: 'contact',
          iconCls: 'ic-gray',
          svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
          label: '联系人工客服',
          desc: '人工协助处理退款问题',
          always: true
        }
      ];

      var body = document.getElementById('acBody');
      var html = '';
      ACTIONS.forEach(function (a) {
        if (!a.always && !a.condition) return;
        html += '<button class="ac-item" data-action="' + a.key + '">';
        html +=   '<span class="ai-icon ' + a.iconCls + '">' + a.svg + '</span>';
        html +=   '<span class="ai-text">';
        html +=     '<div class="ai-label">' + a.label + '</div>';
        html +=     '<div class="ai-desc">' + a.desc + '</div>';
        html +=   '</span>';
        html +=   '<span class="ai-arrow">›</span>';
        html += '</button>';
      });
      body.innerHTML = html;

      body.addEventListener('click', function (e) {
        var item = e.target.closest('.ac-item');
        if (!item) return;
        var action = item.getAttribute('data-action');
        window.csModalBridge.confirm({ action: action, refundId: rid, refundStatus: r.status });
      });

      document.getElementById('btnCancel').addEventListener('click', function () {
        window.csModalBridge.close();
      });
    
      // 主动上报高度（覆盖 autoHeight 早期错误测量）
      if (window.csModalBridge && window.csModalBridge.reportHeight) {
        requestAnimationFrame(function () {
          try {
            window.csModalBridge.reportHeight(document.documentElement.offsetHeight);
          } catch (e) {}
        });
      }

    })();
  </script>
</body>
</html>

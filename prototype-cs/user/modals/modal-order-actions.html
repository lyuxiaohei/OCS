<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>订单操作 · 操作菜单</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../mobile.css" />
  <style>
    html, body { background: #fff; margin: 0; padding: 0; }
    .ac-modal {
      width: 100%;
      background: var(--cs-bg-card);
      border-radius: 20px 20px 0 0;
    }
    .ac-handle { width: 32px; height: 4px; background: rgba(0,0,0,0.12); border-radius: 2px; margin: 8px auto 0; flex-shrink: 0; }
    .ac-head {
      padding: 12px 16px 10px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--cs-border-lighter);
    }
    .ac-head .ac-title {
      font-size: 13px;
      color: var(--cs-text-tertiary);
      text-align: center;
      margin: 0 0 4px;
    }
    .ac-head .ac-order-brief {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      background: var(--cs-bg-header);
      border-radius: 8px;
    }
    .ac-head .ac-order-id {
      font-size: 12px;
      color: var(--cs-text-secondary);
      font-family: "SFMono-Regular", Consolas, monospace;
    }
    .ac-head .ac-order-status {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .ac-head .ac-order-status::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
    }
    .ac-head .ac-order-status.s-warn { background: #fff7e6; color: var(--cs-orange); }
    .ac-head .ac-order-status.s-warn::before { background: var(--cs-orange); }
    .ac-head .ac-order-status.s-done { background: var(--cs-success-bg); color: var(--cs-success); }
    .ac-head .ac-order-status.s-done::before { background: var(--cs-success); }

    .ac-body {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      max-height: 440px;
      -webkit-overflow-scrolling: touch;
      
      padding: 8px 0;
      
    }
    .ac-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      font-family: inherit;
      transition: background .15s;
    }
    .ac-item:hover { background: var(--cs-bg-header); }
    .ac-item:active { background: var(--cs-border-lighter); }
    .ac-item .ai-icon {
      width: 36px; height: 36px;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .ac-item .ai-icon svg { width: 18px; height: 18px; }
    .ac-item .ai-text {
      flex: 1;
      text-align: left;
    }
    .ac-item .ai-label {
      font-size: 14px;
      color: var(--cs-text);
      font-weight: 500;
    }
    .ac-item .ai-desc {
      font-size: 11px;
      color: var(--cs-text-tertiary);
      margin-top: 2px;
    }
    .ac-item .ai-arrow {
      color: var(--cs-text-placeholder);
      font-size: 16px;
    }
    /* 图标背景配色 */
    .ac-item .ai-icon.ic-blue   { background: var(--cs-primary-bg); color: var(--cs-primary); }
    .ac-item .ai-icon.ic-orange { background: #fff7e6; color: #fa8c16; }
    .ac-item .ai-icon.ic-red    { background: #fff1f0; color: #f5222d; }
    .ac-item .ai-icon.ic-green  { background: #f6ffed; color: #52c41a; }
    .ac-item .ai-icon.ic-purple { background: #f9f0ff; color: #722ed1; }
    .ac-item .ai-icon.ic-gray   { background: var(--cs-bg-header); color: var(--cs-text-secondary); }

    .ac-cancel {
      width: calc(100% - 32px);
      margin: 4px 16px 14px;
      height: 40px;
      border-radius: 20px;
      border: 1px solid var(--cs-border);
      background: var(--cs-bg-card);
      color: var(--cs-text-secondary);
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      flex-shrink: 0;
    }
    .ac-cancel:active { background: var(--cs-bg-header); }
  </style>
</head>
<body>
  <div class="ac-modal">
    <div class="ac-handle"></div>
    <div class="ac-head">
      <p class="ac-title">订单操作</p>
      <div class="ac-order-brief" id="orderBrief">
        <span class="ac-order-id" id="orderId">订单 #—</span>
        <span class="ac-order-status s-warn" id="orderStatus">—</span>
      </div>
    </div>

    <div class="ac-body" id="acBody">
      <!-- 由 JS 渲染 -->
    </div>

    <button class="ac-cancel" id="btnCancel">取消</button>
  </div>

  <script src="../js/cs-modal.js"></script>
  <script>
    (function () {
      // ===== 订单 mock 库（用于显示状态徽标）=====
      var ORDERS = {
        // 数据源：order_detail.html 的真实订单号
        'JS2026040888001': { status: '运输中', statusType: 's-warn' },
        'JS202604110002': { status: '待发货', statusType: 's-warn' },
        'JS2026031011006': { status: '已签收', statusType: 's-done' }
      };
      var DEFAULT = { status: '运输中', statusType: 's-warn' };

      var qs = new URLSearchParams(location.search);
      var oid = qs.get('id') || qs.get('order_id') || 'JS2026040888001';
      var o = ORDERS[oid] || DEFAULT;

      document.getElementById('orderId').textContent = '订单 #' + oid;
      var statusEl = document.getElementById('orderStatus');
      statusEl.textContent = o.status;
      statusEl.className = 'ac-order-status ' + o.statusType;

      // ===== 操作项配置 =====
      // 排期表要求：申请退换货 / 取消订单 / 修改地址
      var ACTIONS = [
        {
          key: 'viewDetail',
          iconCls: 'ic-blue',
          svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
          label: '查看订单详情',
          desc: '商品、金额、收货信息完整详情'
        },
        {
          key: 'refund',
          iconCls: 'ic-orange',
          svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>',
          label: '申请退换货',
          desc: '退货退款 / 仅退款 / 换货'
        },
        {
          key: 'cancel',
          iconCls: 'ic-red',
          svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
          label: '取消订单',
          desc: '取消并申请退款（仅待发货可取消）'
        },
        {
          key: 'modifyAddress',
          iconCls: 'ic-purple',
          svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
          label: '修改收货地址',
          desc: '发货前可修改收货人信息'
        },
        {
          key: 'trackLogistics',
          iconCls: 'ic-green',
          svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>',
          label: '查看物流',
          desc: '查看包裹实时位置'
        },
        {
          key: 'contact',
          iconCls: 'ic-gray',
          svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
          label: '继续咨询客服',
          desc: '返回会话继续沟通'
        }
      ];

      // 渲染操作项
      var body = document.getElementById('acBody');
      var html = '';
      ACTIONS.forEach(function (a) {
        html += '<button class="ac-item" data-action="' + a.key + '">';
        html +=   '<span class="ai-icon ' + a.iconCls + '">' + a.svg + '</span>';
        html +=   '<span class="ai-text">';
        html +=     '<div class="ai-label">' + a.label + '</div>';
        html +=     '<div class="ai-desc">' + a.desc + '</div>';
        html +=   '</span>';
        html +=   '<span class="ai-arrow">›</span>';
        html += '</button>';
      });
      body.innerHTML = html;

      // 绑定点击
      body.addEventListener('click', function (e) {
        var item = e.target.closest('.ac-item');
        if (!item) return;
        var action = item.getAttribute('data-action');
        window.csModalBridge.confirm({ action: action, orderId: oid, orderStatus: o.status });
      });

      document.getElementById('btnCancel').addEventListener('click', function () {
        window.csModalBridge.close();
      });
    
      // 主动上报高度（覆盖 autoHeight 早期错误测量）
      if (window.csModalBridge && window.csModalBridge.reportHeight) {
        requestAnimationFrame(function () {
          try {
            window.csModalBridge.reportHeight(document.documentElement.offsetHeight);
          } catch (e) {}
        });
      }

    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的 - 苏银豆商城</title>
<link rel="stylesheet" href="../css/common.css">
<style>
  /* Profile header - gradient background, extends to status bar */
  .profile-header {
    position: relative;
    background: linear-gradient(135deg, var(--primary-start), var(--price-color));
    padding-top: 44px;
    padding-bottom: var(--space-xl);
  }
  .profile-header::after {
    content: '';
    position: absolute;
    bottom: -12px;
    left: 0;
    right: 0;
    height: 24px;
    background: var(--bg-color);
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    z-index: 0;
  }
  .profile-header .status-bar { color: var(--card-bg); }
  .profile-header .status-bar svg { fill: var(--card-bg); }
  .profile-header .nav-bar .nav-title { color: var(--card-bg); }

  /* Profile content area */
  .profile-content {
    padding: 0 var(--space-lg);
    position: relative;
    z-index: 1;
  }
  .profile-info {
    display: flex;
    align-items: center;
    gap: var(--space-md);
  }
  .profile-avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.5);
    flex-shrink: 0;
  }
  .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .profile-detail { flex: 1; }
  .profile-name {
    font-size: var(--font-lg);
    font-weight: 700;
    color: var(--card-bg);
    margin-bottom: 2px;
  }
  .profile-level {
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
    background: rgba(255,255,255,0.2);
    padding: 2px var(--space-sm);
    border-radius: var(--radius-md);
    font-size: var(--font-sm);
    color: var(--card-bg);
  }
  .profile-level svg { width: 12px; height: 12px; }
  .cs-header-btn {
          width: 32px;
          height: 32px;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #fff;
          cursor: pointer;
        }
        .cs-header-btn svg {
          width: 22px;
          height: 22px;
        }
        .settings-btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .settings-btn svg { width: 22px; height: 22px; color: var(--card-bg); }

  /* Stats row */
  .profile-stats {
    display: flex;
    justify-content: space-around;
    margin-top: var(--space-lg);
  }
  .stat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: pointer;
  }
  .stat-item .num { font-size: var(--font-lg); font-weight: 700; color: var(--card-bg); }
  .stat-item .label { font-size: var(--font-sm); color: rgba(255,255,255,0.8); }

  /* Order section */
  .order-section {
    background: var(--card-bg);
    margin: var(--space-sm) var(--space-md);
    border-radius: var(--radius-md);
    overflow: hidden;
    position: relative;
    z-index: 1;
  }
  .order-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-md) var(--space-md) var(--space-sm);
  }
  .order-header .title { font-size: var(--font-md); font-weight: 600; color: var(--text-color); }
  .order-header .view-all {
    font-size: var(--font-sm);
    color: var(--text-tertiary);
    display: flex;
    align-items: center;
    gap: 2px;
    cursor: pointer;
  }
  .order-header .view-all svg { width: 14px; height: 14px; }
  .order-tabs {
    display: flex;
    padding: 0 var(--space-sm) var(--space-md);
  }
  .order-tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    position: relative;
  }
  .order-tab:active { opacity: 0.7; }
  .order-tab svg { width: 24px; height: 24px; color: var(--text-secondary); }
  .order-tab span { font-size: var(--font-sm); color: var(--text-secondary); }
  .order-tab .order-badge {
    position: absolute;
    top: -4px;
    right: calc(50% - 20px);
    background: var(--price-color);
    color: var(--card-bg);
    font-size: var(--font-xs);
    min-width: 14px;
    height: 14px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 var(--space-xs);
  }

  /* Quick tools */
  .tools-section {
    background: var(--card-bg);
    margin: 0 var(--space-md) var(--space-sm);
    border-radius: var(--radius-md);
    padding: var(--space-md);
  }
  .tools-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-md) 0;
  }
  .tool-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-sm);
    cursor: pointer;
  }
  .tool-item:active { opacity: 0.7; }
  .tool-item .tool-icon {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tool-item .tool-icon svg { width: 22px; height: 22px; color: var(--card-bg); }
  .tool-item span { font-size: var(--font-sm); color: var(--text-secondary); }

  /* Menu list */
  .menu-section {
    background: var(--card-bg);
    margin: 0 var(--space-md) var(--space-sm);
    border-radius: var(--radius-md);
    overflow: hidden;
  }
  .menu-item {
    display: flex;
    align-items: center;
    padding: var(--space-lg) var(--space-md);
    cursor: pointer;
    border-bottom: 1px solid var(--bg-color);
  }
  .menu-item:last-child { border-bottom: none; }
  .menu-item:active { background: var(--hover-bg); }
  .menu-item svg { width: 20px; height: 20px; color: var(--primary-start); margin-right: var(--space-md); flex-shrink: 0; }
  .menu-item .menu-label { flex: 1; font-size: var(--font-base); color: var(--text-color); }
  .menu-item .menu-arrow { color: var(--text-light); font-size: var(--font-sm); }
</style>
</head>

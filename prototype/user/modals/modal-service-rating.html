<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>服务评价 · 弹窗</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../mobile.css" />
  <link rel="stylesheet" href="../chat.css" />
  <script src="../js/cs-modal.js"></script>
  <script src="../js/cs-common.js"></script>
  <style>
    html, body { background: #fff; margin: 0; padding: 0; }
    .sr-modal {
      width: 100%;
      background: #fff;
      border-radius: 20px 20px 0 0;
      padding: 8px 20px 24px;
    }
    .sr-handle { width: 32px; height: 4px; background: rgba(0,0,0,0.12); border-radius: 2px; margin: 0 auto 16px; }

    /* 去掉评价卡片样式，内容直接铺满弹窗 */
    .sr-modal .msg-rating-card {
      background: none; border: none; border-radius: 0;
      box-shadow: none; padding: 0; max-width: 100%; width: 100%;
    }
    .sr-modal .msg-rating-card .rc-title { font-size: 17px; text-align: center; margin-bottom: 6px; }
    .sr-modal .msg-rating-card .rc-sub { font-size: 13px; text-align: center; margin-bottom: 20px; }
    .sr-modal .msg-rating-card .rc-stars { justify-content: center; gap: 12px; margin-bottom: 20px; }
    .sr-modal .msg-rating-card .rc-star { font-size: 36px; }
    .sr-modal .msg-rating-card .rc-resolve { text-align: center; margin-bottom: 20px; }
    .sr-modal .msg-rating-card .rc-resolve-q { text-align: center; }
    .sr-modal .msg-rating-card .rc-resolve-btns { max-width: 240px; margin: 0 auto; }
    .sr-modal .msg-rating-card .rc-submit { height: 44px; border-radius: 22px; font-size: 14px; }
    .sr-modal .msg-rating-card .rc-thanks { padding: 16px 0; font-size: 15px; }

    .sr-close {
      width: 100%; height: 40px; margin-top: 14px;
      border-radius: 20px; border: 1px solid var(--cs-border);
      background: #fff; color: var(--cs-text-secondary);
      font-size: 14px; cursor: pointer; font-family: inherit;
    }
    .sr-close:active { background: var(--cs-bg-header); }
  </style>
</head>
<body>
  <div class="sr-modal">
    <div class="sr-handle"></div>
    <div class="sr-card-wrap" id="cardWrap">
      <!-- 由 CsCommon.ratingCard() 注入，与会话内评价卡片（未提交）完全一致 -->
    </div>
    <button class="sr-close" id="btnClose">关闭</button>
  </div>

  <script>
    (function () {
      // 注入与会话内完全一致的评价卡片 HTML
      var wrap = document.getElementById('cardWrap');
      wrap.innerHTML = CsCommon.ratingCard();

      // 绑定交互（星级/已解决未解决/提交）—— 复用 CsCommon.bindRating
      // bindRating 需要传入包含 .msg-rating-card 的父级 row
      var row = document.createElement('div');
      row.className = 'msg-row';
      row.appendChild(wrap.querySelector('.msg-rating-card'));
      wrap.appendChild(row);
      CsCommon.bindRating(row);

      // 提交后回调宿主
      var card = wrap.querySelector('.msg-rating-card');
      var submitBtn = card.querySelector('.rc-submit');
      submitBtn.addEventListener('click', function () {
        // 等待 .done 类加上后再通知宿主
        setTimeout(function () {
          var rating = 0;
          card.querySelectorAll('.rc-star.active').forEach(function () { rating++; });
          var resolve = '';
          var activeBtn = card.querySelector('.rc-resolve-btn.active');
          if (activeBtn) resolve = activeBtn.getAttribute('data-v');
          try { sessionStorage.setItem('cs_rating_status', 'completed'); } catch (e) {}
          window.csModalBridge.confirm({ status: 'completed', rating: rating, resolve: resolve });
          if (window.csModal && csModal.toast) csModal.toast('评价已提交，感谢您的反馈');
          setTimeout(function () { window.csModalBridge.close(); }, 800);
        }, 50);
      });

      document.getElementById('btnClose').addEventListener('click', function () {
        window.csModalBridge.close();
      });

      // 主动上报高度
      if (window.csModalBridge && window.csModalBridge.reportHeight) {
        requestAnimationFrame(function () {
          try { window.csModalBridge.reportHeight(document.documentElement.offsetHeight); } catch (e) {}
        });
      }
    })();
  </script>
</body>
</html>
